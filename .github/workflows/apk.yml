# Costruisce l'APK di BoardLab (Capacitor) e la pubblica tra le Release del repository.
# Parte da sola quando cambia la versione web (index.html) o la cartella apk/.
name: APK Android

on:
  push:
    branches: [main]
    paths: ['index.html', 'lib/**', 'fonts/**', 'apk/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Strumenti Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: App dentro l'APK
        working-directory: apk
        run: |
          npm ci --no-audit --no-fund
          python3 build_www.py
          npx cap sync android

      - name: Costruzione
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Nome del file
        id: apk
        run: |
          VER=$(python3 -c "import json;print(json.load(open('apk/version.json'))['versionName'])")
          cp apk/android/app/build/outputs/apk/release/app-release.apk "BoardLab-$VER.apk"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: BoardLab-${{ steps.apk.outputs.ver }}
          path: BoardLab-${{ steps.apk.outputs.ver }}.apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=${{ steps.apk.outputs.ver }}
          gh release create "v$VER" "BoardLab-$VER.apk" --title "BoardLab $VER" --notes "APK di BoardLab $VER per Android." \
            || gh release upload "v$VER" "BoardLab-$VER.apk" --clobber
