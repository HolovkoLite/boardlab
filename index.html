<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="BoardLab: lavagna digitale per la penna">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>BoardLab</title>
<style>
/* Layout: app a schermo intero in stile Nebo — libreria (pannello laterale + elenco) e lavagna (barra titolo, barra strumenti, foglio infinito). Tema unico chiaro, scelto di proposito. */
:root {
  --blue: #2196F3;
  --blue-soft: #E3F2FD;
  --ink: #1F2124;
  --muted: #7A7F85;
  --line: #E4E7EA;
  --pane: #EAEEF2;
  --white: #FFFFFF;
  --sel: #E4E4E4;
  --danger: #E53935;
  --shadow: 0 6px 24px rgba(20, 30, 40, .18);
  --font: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--pane); color: var(--ink); font: 15px/1.35 var(--font);
  overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
input { font: inherit; color: inherit; }
#app { position: relative; height: 100%; overflow: hidden; }
.ic { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic .f { fill: currentColor; stroke: none; }
.ic .tip { fill: var(--tc, #000); stroke: none; }
.ic .tipl { stroke: var(--tc, #FFD83B); stroke-width: 3.2; }
.ib { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: #3A3D41; flex: none; }
.ib:active { background: rgba(0,0,0,.06); }
.ib.sm { width: 36px; height: 36px; }
.ib.sm .ic { width: 20px; height: 20px; }
.ib:disabled { opacity: .3; cursor: default; }
.sp { flex: 1; }
.link { color: var(--blue); font-weight: 500; letter-spacing: .02em; }
.tbtn { color: var(--blue); font-weight: 500; letter-spacing: .04em; padding: 10px 12px; border-radius: 6px; }
.tbtn:active { background: var(--blue-soft); }
.tbtn.danger { color: var(--danger); }

/* ---------- Libreria ---------- */
#lib { position: absolute; inset: 0; display: flex; }
#drawer { width: 280px; flex: none; background: var(--white); display: flex; flex-direction: column; z-index: 5; }
.dr-head { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 8px; height: 56px; box-sizing: border-box; }
.dr-head h2 { font-size: 20px; font-weight: 400; margin: 0 0 0 8px; flex: 1; }
.dr-sync { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px 14px; font-size: 12.5px; white-space: nowrap; color: #55595E; border-bottom: 1px solid var(--line); }
.dr-sync .link { font-size: 14px; }
.dr-list { flex: 1; overflow-y: auto; padding: 6px 6px 12px; }
.coll { display: flex; align-items: center; gap: 10px; padding: 0 0 0 12px; height: 46px; color: #55595E; cursor: pointer; border-radius: 10px; }
.coll .ic { width: 22px; height: 22px; }
.coll-n { flex: 1; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fold { display: flex; align-items: center; gap: 18px; padding: 0 14px 0 18px; height: 46px; border-radius: 10px; cursor: pointer; }
.fold.sel { background: var(--blue-soft); }
.fold .fi { color: var(--fc); width: 26px; height: 26px; }
.fold-n { flex: 1; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fold-c { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty-f { padding: 6px 18px 10px 50px; font-size: 13px; color: var(--muted); }
.srow { display: flex; align-items: center; gap: 22px; width: 100%; padding: 0 16px; height: 50px; border-radius: 10px; text-align: left; font-size: 16px; }
.srow .ic { color: #45494E; }
.srow.sel { background: var(--blue-soft); }
.dr-nav { display: flex; border-top: 1px solid var(--line); height: 60px; flex: none; }
.dr-nav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #55595E; font-size: 12px; font-weight: 500; }
.dr-nav button.on { color: var(--blue); }
.dr-nav button span { display: none; }
.dr-nav button.on span { display: block; }
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.mn-head { display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px 0 16px; flex: none; }
.mn-head h1 { font-size: 20px; font-weight: 400; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mn-head .ib:first-child { margin-left: -8px; }
.srch { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--white); border-radius: 22px; padding: 0 14px; height: 40px; color: var(--muted); }
.srch input { flex: 1; border: 0; outline: 0; background: none; font-size: 15px; color: var(--ink); min-width: 0; }
.mn-sub { display: flex; justify-content: flex-end; align-items: center; gap: 6px; padding: 0 12px 8px; flex: none; }
.chip { display: flex; align-items: center; gap: 8px; background: #E0E5EA; border-radius: 20px; padding: 0 14px 0 10px; height: 36px; font-size: 14px; }
.chip .ic { width: 20px; height: 20px; }
.mn-body { flex: 1; overflow-y: auto; padding: 4px 20px 96px; }
.blist { display: flex; flex-direction: column; gap: 4px; }
.bcard { display: flex; align-items: center; gap: 16px; padding: 6px 4px 6px 4px; border-radius: 10px; cursor: pointer; }
.bcard:active { background: rgba(0,0,0,.04); }
.thumb { width: 64px; height: 48px; border-radius: 4px; border: 1px solid #DCE1E6; overflow: hidden; flex: none; display: grid; place-items: center; }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; -webkit-user-drag: none; }
[data-ctx] { -webkit-touch-callout: none; touch-action: pan-y; }
.pressing { background: rgba(0,0,0,.07) !important; }
.bt { flex: 1; min-width: 0; }
.bn { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd { font-size: 13.5px; color: #8A8F95; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bcard .ib { color: #8A8F95; }
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
.bgrid .bcard { flex-direction: column; align-items: stretch; gap: 8px; padding: 8px; background: var(--white); position: relative; }
.bgrid .thumb { width: 100%; height: auto; aspect-ratio: 4 / 3; }
.bgrid .bt { padding: 0 32px 4px 4px; }
.bgrid .bcard .ib { position: absolute; right: 2px; bottom: 4px; }
.empty { text-align: center; color: var(--muted); padding: 64px 24px; font-size: 15px; line-height: 1.5; }
.empty b { display: block; color: #4C5157; font-size: 17px; font-weight: 500; margin-bottom: 4px; }
.fab { position: absolute; right: 24px; bottom: 24px; width: 60px; height: 60px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(33,150,243,.45); }
.fab .ic { width: 28px; height: 28px; stroke-width: 2.2; }
.trow-b { display: flex; align-items: center; gap: 16px; padding: 6px 4px; }
.note { font-size: 13px; color: var(--muted); margin: 0 0 12px 4px; }
.setp { max-width: 640px; display: flex; flex-direction: column; gap: 12px; }
.setp p { margin: 0; color: #4C5157; line-height: 1.5; }
.setp ul { margin: 0; padding-left: 20px; color: #4C5157; line-height: 1.6; }
.trow { display: flex; align-items: center; gap: 16px; background: var(--white); border-radius: 12px; padding: 14px 16px; text-align: left; width: 100%; }
.trow b { display: block; font-weight: 500; font-size: 15.5px; }
.trow small { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.trow > span:first-child { flex: 1; }
.trow { box-sizing: border-box; }
.trow.col { flex-direction: column; align-items: stretch; gap: 12px; }
.seg.nums .seg-b { min-width: 0; padding: 10px 0; font-size: 16px; font-variant-numeric: tabular-nums; }
.seg.nums { background: var(--pane); border-radius: 10px; padding: 4px; }
.seg.nums .seg-b.on { background: var(--white); color: var(--blue); font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.tg { width: 40px; height: 22px; border-radius: 11px; background: #C3C8CE; position: relative; flex: none; transition: background .15s; }
.tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
.tg.on { background: var(--blue); }
.tg.on::after { transform: translateX(18px); }
.card { background: var(--white); border-radius: 12px; padding: 16px; }
.help dl { margin: 0; display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 10px 20px; }
.help dt { font-weight: 500; }
.help dd { margin: 0; color: #4C5157; }

/* ---------- Lavagna ---------- */
#editor { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--white); }
.ed-bar { display: flex; align-items: center; gap: 2px; height: 52px; padding: 0 6px; flex: none; }
.ed-titles { display: flex; flex-direction: column; align-items: flex-start; padding: 2px 8px; border-radius: 8px; min-width: 0; max-width: 60%; text-align: left; }
#edTitle { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
#edSub { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
#edSub .dot { width: 10px; height: 10px; border-radius: 2px; }
.ed-tools { display: flex; align-items: center; justify-content: center; gap: 2px; height: 48px; padding: 0 8px; border-bottom: 1px solid #E8E8E8; flex: none; overflow-x: auto; scrollbar-width: none; }
.tb { width: 44px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: #222; flex: none; }
.tb.on { background: var(--sel); }
.tb .ic { width: 26px; height: 26px; }
.tsep { width: 1px; height: 26px; background: #DADADA; margin: 0 10px; flex: none; }
.sws { display: flex; gap: 4px; }
.sw { width: 30px; height: 30px; border-radius: 50%; background: var(--c); display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); color: #fff; }
.sw .ic { width: 18px; height: 18px; stroke-width: 2.6; opacity: 0; }
.sw.on .ic { opacity: 1; }
.sw.lt { color: #222; }
.sw.add { background: none; box-shadow: none; border: 1.5px dashed #9AA0A6; color: #6B7075; box-sizing: border-box; margin-left: 6px; }
.sw.add .ic { opacity: 1; stroke-width: 2; }
.sw.big { width: 36px; height: 36px; }
#stage { flex: 1; position: relative; overflow: hidden; touch-action: none; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pgpill { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--white); border-radius: 23px; box-shadow: 0 2px 10px rgba(0,0,0,.16); z-index: 2; }
.pgpill button { height: 46px; padding: 0 20px; font-size: 15px; color: #3A3D41; white-space: nowrap; }
.zpill { position: absolute; left: 16px; bottom: 16px; display: flex; background: var(--white); border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.16); overflow: hidden; z-index: 2; }
.zpill button { height: 46px; min-width: 52px; padding: 0 12px; display: grid; place-items: center; color: var(--blue); }
.zpill button + button { border-left: 1px solid #EEE; }
#zLabel { font-size: 15px; min-width: 64px; font-variant-numeric: tabular-nums; }
#zLock { color: #8A8F95; }
#zLock.on { color: var(--blue); }
.zpill .ic { width: 22px; height: 22px; }

/* ---------- Livelli: menu, popover, dialoghi ---------- */
.layer { position: fixed; inset: 0; z-index: 50; }
.layer.dim { background: rgba(0,0,0,.32); display: grid; place-items: center; padding: 16px; }
.menu, .pop { position: absolute; background: var(--white); border-radius: 6px; box-shadow: var(--shadow); }
.menu { min-width: 220px; padding: 8px 0; }
.menu-i { display: flex; align-items: center; gap: 16px; width: 100%; padding: 0 20px; height: 48px; text-align: left; font-size: 16px; }
.menu-i:active { background: rgba(0,0,0,.05); }
.menu-i .ic { color: #45494E; width: 22px; height: 22px; }
.menu-i span { flex: 1; }
.menu-i small { font-size: 12px; color: var(--muted); }
.menu-i.dis { color: #A5AAAF; }
.menu-i.dis .ic { color: #BBC0C4; }
.menu-i.danger, .menu-i.danger .ic { color: var(--danger); }
.menu-sep { height: 1px; background: var(--line); margin: 6px 0; }
.pop { padding: 18px 20px 20px; }
.pop-h { display: flex; align-items: center; gap: 4px; font-size: 19px; margin-bottom: 14px; }
.lbl { font-size: 13px; color: var(--muted); margin: 12px 0 8px; }
.seg { display: flex; gap: 6px; }
.seg-b { flex: 1; min-width: 104px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; border-radius: 8px; font-size: 15px; color: #55595E; }
.seg-b.on { background: var(--sel); color: var(--ink); }
.seg-b .ic { width: 26px; height: 26px; color: #222; }
.abc { font-weight: 700; font-size: 17px; color: #222; padding: 0 3px; line-height: 26px; }
.abc.free { background: linear-gradient(170deg, transparent 30%, rgba(160,160,160,.55) 30%, rgba(160,160,160,.55) 75%, transparent 75%); }
.abc.straight { background: linear-gradient(transparent 32%, rgba(160,160,160,.55) 32%, rgba(160,160,160,.55) 80%, transparent 80%); }
.sizes { display: flex; justify-content: space-between; margin: 14px 4px 4px; }
.sz { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; }
.sz.on { background: var(--sel); }
.sz i { display: block; border-radius: 50%; background: #5F6368; }
.try { position: relative; margin-top: 14px; border: 1px solid #ECECEC; border-radius: 6px; overflow: hidden; }
.try canvas { display: block; touch-action: none; background: #fff; }
.try-l { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 12.5px; color: #8A8F95; pointer-events: none; }
.cpick { width: 300px; box-sizing: border-box; }
.ring { position: relative; width: 190px; height: 190px; margin: 4px auto 6px; touch-action: none; }
.ring-g { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(#f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); -webkit-mask: radial-gradient(circle, transparent 60%, #000 61%); mask: radial-gradient(circle, transparent 60%, #000 61%); }
.ring-c { position: absolute; inset: 40px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.ring-k { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); box-sizing: border-box; pointer-events: none; }
.rng { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 4px; outline: none; margin: 4px 0; }
.rng::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--blue); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.rng::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--blue); border: 3px solid #fff; }
.bgc { display: flex; flex-wrap: wrap; gap: 8px; max-width: 330px; }
.pats { display: flex; gap: 8px; }
.pat { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; border-radius: 8px; font-size: 13.5px; color: #55595E; }
.pat.on { background: var(--sel); color: var(--ink); }
.pv { width: 62px; height: 44px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.pv-lines { background-image: linear-gradient(rgba(0,0,0,.18) 1px, transparent 1px); background-size: 100% 10px; }
.pv-grid { background-image: linear-gradient(rgba(0,0,0,.15) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.15) 1px, transparent 1px); background-size: 8px 8px; }
.pv-dots { background-image: radial-gradient(rgba(0,0,0,.35) 1px, transparent 1.4px); background-size: 8px 8px; }
.dlg { background: var(--white); border-radius: 6px; box-shadow: var(--shadow); width: min(560px, 100%); padding: 22px 24px 12px; box-sizing: border-box; }
.dlg-t { font-size: 17px; margin-bottom: 18px; }
.dlg-p { margin: 0 0 8px; color: #4C5157; line-height: 1.5; }
.dlg-in { width: 100%; box-sizing: border-box; border: 0; border-bottom: 2px solid var(--blue); outline: 0; padding: 8px 2px; font-size: 17px; background: none; }
.dlg-b { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
.fcols { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.fcol { width: 36px; height: 36px; border-radius: 50%; background: var(--c); display: grid; place-items: center; color: #fff; }
.fcol .ic { width: 20px; height: 20px; stroke-width: 2.6; opacity: 0; }
.fcol.on .ic { opacity: 1; }
.pick { max-height: 50vh; overflow-y: auto; margin: 0 -8px; }
.pick-c { font-size: 13px; color: var(--muted); padding: 10px 12px 4px; }
.pick-f { display: flex; align-items: center; gap: 14px; width: 100%; padding: 0 12px; height: 44px; border-radius: 8px; text-align: left; font-size: 16px; }
.pick-f.on { background: var(--blue-soft); }
.pick-f .ic { color: var(--fc); }
#toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #2F3337; color: #fff; border-radius: 8px; padding: 12px 18px; display: flex; align-items: center; gap: 18px; font-size: 14.5px; z-index: 80; box-shadow: var(--shadow); max-width: calc(100% - 32px); box-sizing: border-box; }
#toast .link { color: #82C4FF; }
#txtEd { position: absolute; z-index: 3; margin: 0; padding: 0; border: 0; outline: 1.5px dashed rgba(33,150,243,.75); outline-offset: 4px; background: transparent; resize: none; overflow: hidden; white-space: pre; font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif; transform-origin: 0 0; box-sizing: content-box; caret-color: var(--blue); -webkit-user-select: text; user-select: text; }
.selbar { position: absolute; z-index: 4; display: flex; gap: 2px; background: #ECEEF0; border-radius: 24px; box-shadow: 0 4px 16px rgba(20,30,40,.2); padding: 4px; white-space: nowrap; }
.selbar button { height: 40px; padding: 0 14px; border-radius: 20px; font-size: 15px; color: #2B2E31; }
.selbar button:active { background: rgba(0,0,0,.08); }
.selbar .danger { color: var(--danger); }
.findbar { position: absolute; z-index: 5; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; background: var(--white); border-radius: 24px; box-shadow: 0 4px 16px rgba(20,30,40,.2); padding: 2px 4px 2px 14px; width: min(520px, calc(100% - 24px)); box-sizing: border-box; color: var(--muted); }
.findbar input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; color: var(--ink); height: 40px; padding: 0 8px; }
.findbar #findN { font-size: 13px; color: var(--muted); white-space: nowrap; padding: 0 6px; }
.findbar #findN.none { color: var(--danger); }
.tplpop { width: min(560px, calc(100vw - 16px)); max-height: calc(100vh - 16px); overflow: auto; box-sizing: border-box; padding-bottom: 10px; }
.tpl-sec { display: flex; align-items: center; gap: 8px; width: calc(100% + 16px); margin: 0 -8px 8px; padding: 0 8px; height: 40px; border-radius: 8px; text-align: left; font-size: 13px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tpl-sec:active { background: rgba(0,0,0,.05); }
.tpl-sec .ic { width: 20px; height: 20px; flex: none; }
.tpl-sec span { flex: 1; }
.tpl-sec small { font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: none; background: #EEF1F4; border-radius: 10px; padding: 2px 8px; }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.tpl { border-radius: 8px; cursor: pointer; padding: 6px; background: #F4F6F8; }
.tpl:active { background: #E8ECEF; }
.tpl .thumb { width: 100%; height: auto; aspect-ratio: 4 / 3; background: #FFFFFF; }
.tpl-f { display: flex; align-items: center; gap: 2px; padding: 4px 0 0 4px; }
.tpl-n { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tpl-empty { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
.tpl-list { margin: 0 -20px; }
.snips { display: flex; flex-direction: column; gap: 2px; margin: -2px 0 10px 84px; }
.snip { display: flex; align-items: center; gap: 10px; text-align: left; padding: 7px 10px; border-radius: 8px; font-size: 14px; color: #3C4146; line-height: 1.35; }
.snip:active { background: rgba(0,0,0,.05); }
.snip .ic { width: 18px; height: 18px; color: #8A8F95; flex: none; }
.snip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.snip mark { background: #FFE082; color: inherit; border-radius: 3px; padding: 0 1px; }
.snip.more { color: var(--blue); padding-left: 38px; }

function hex2rgb(hex) { const v = hex.replace('#', ''); const n = parseInt(v.length === 3 ? v.split('').map(c => c + c).join('') : v, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

      } catch (e) { clearTimeout(t); res(null); }
    });
    return dbp;
  }
  async function get(k) {
    const db = await open(); if (!db) return mem.get(k);
    return new Promise(res => { try { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result === undefined ? mem.get(k) : q.result); q.onerror = () => res(mem.get(k)); } catch (e) { res(mem.get(k)); } });
  }
  async function set(k, v) {
    mem.set(k, v); const db = await open(); if (!db) return;
    return new Promise(res => { try { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = tx.onerror = tx.onabort = () => res(); } catch (e) { res(); } });
  }
  async function del(k) {
    mem.delete(k); const db = await open(); if (!db) return;
    return new Promise(res => { try { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = tx.onerror = tx.onabort = () => res(); } catch (e) { res(); } });
  }
  async function keys(prefix) {
    const db = await open();
    const all = db ? await new Promise(res => { try { const q = db.transaction('kv').objectStore('kv').getAllKeys(IDBKeyRange.bound(prefix, prefix + '\uffff')); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); } catch (e) { res([]); } }) : [];
    return [...new Set(all.concat([...mem.keys()].filter(k => typeof k === 'string' && k.startsWith(prefix))))];
  }
  return { get, set, del, keys };
})();

/* Le anteprime stanno fuori dall'elenco delle lavagne, sotto 'th:<id>': l'elenco resta piccolo e i salvataggi automatici leggeri.
   Si caricano solo quando servono e restano in memoria. */
const THUMBS = new Map(), thLoading = new Set();
function thumbImg(id) {
  const u = THUMBS.get(id); if (u === undefined) loadThumb(id);
  return `<img data-th="${id}" alt="" draggable="false"${u ? ` src="${u}"` : ' hidden'}>`;
}
function showThumb(id) { const u = THUMBS.get(id); document.querySelectorAll(`img[data-th="${id}"]`).forEach(im => { if (u) { im.src = u; im.hidden = false; } else { im.removeAttribute('src'); im.hidden = true; } }); }
async function loadThumb(id) {
  if (thLoading.has(id)) return; thLoading.add(id);
  let u = null; try { u = (await DB.get('th:' + id)) || null; } catch (_) {}
  thLoading.delete(id);
  if (!THUMBS.has(id)) THUMBS.set(id, u);
  showThumb(id);
}
function setThumb(id, u) { THUMBS.set(id, u || null); if (u) DB.set('th:' + id, u); else DB.del('th:' + id); showThumb(id); }
function dropThumb(id) { THUMBS.delete(id); DB.del('th:' + id); }
/* Immagini e pagine PDF non più usate da nessuna lavagna (cestino compreso), da nessun modello e dagli appunti: vengono eliminate.
   Si fa quando elimini definitivamente qualcosa e, al massimo una volta alla settimana, all'avvio. */
let gcBusy = false;
async function gcImages() {
  if (gcBusy) return 0; gcBusy = true;
  let n = 0;
  try {
    const keys = await DB.keys('img:'); if (!keys.length) return 0;
    const used = new Set(), add = items => { for (const it of items || []) if (it && it.img) used.add(it.img); };
    for (const b of meta.boards.slice()) { const d = await DB.get('b:' + b.id); add(d && d.items); }
    for (const t of (meta.tpls || []).slice()) { const d = await DB.get('tpl:' + t.id); add(d && d.items); }
    add(clip);
    if (ed) { add(ed.items); for (const hh of ed.hist.concat(ed.fut)) { add(hh.b); add(hh.a); } }
    for (const k of keys) {
      const id = k.slice(4); if (used.has(id)) continue;
      await DB.del(k); n++;
      const e = IMG.get(id); if (e) { try { e.el && e.el.close && e.el.close(); } catch (_) {} IMG.delete(id); }
    }
    meta.ui.lastGc = Date.now(); saveMeta();
  } catch (_) {} finally { gcBusy = false; }
  return n;
}

let swallowUntil = 0;
/* Un tocco fuori da un menu lo chiude senza attivare ciò che sta sotto; il tocco successivo funziona normalmente */
document.addEventListener('pointerdown', () => { swallowUntil = 0; }, true);
document.addEventListener('click', e => { if (performance.now() < swallowUntil) { e.stopPropagation(); e.preventDefault(); } }, true);
function layer(modal) {
  const L = h('div', 'layer' + (modal ? ' dim' : ''));
  $('#layers').append(L);
  L.addEventListener('pointerdown', e => { if (e.target === L) { e.preventDefault(); swallowUntil = performance.now() + 450; closeLayer(L); } });
  return L;
}
function closeLayer(L) { if (!L.isConnected) return; L.remove(); if (L.onClose) L.onClose(); }
function closeAllLayers() { [...$('#layers').children].forEach(closeLayer); }
function place(el, anchor, mode) {
  const r = anchor.getBoundingClientRect(), w = el.offsetWidth, hh = el.offsetHeight, W = innerWidth, H = innerHeight;
  let x = mode === 'center' ? r.left + r.width / 2 - w / 2 : (r.left + r.width / 2 > W / 2 ? r.right - w : r.left);
  x = clamp(x, 8, W - w - 8);
  let y = r.bottom + 4;
  if (y + hh > H - 8) y = Math.max(8, r.top - hh - 4);
  if (y + hh > H - 8) y = Math.max(8, H - hh - 8);
  el.style.left = x + 'px'; el.style.top = y + 'px';
}
function menu(anchor, items) {
  const L = layer(false), m = h('div', 'menu');
  for (const it of items) {
    if (it.sep) { m.append(h('div', 'menu-sep')); continue; }
    const b = h('button', 'menu-i' + (it.disabled ? ' dis' : '') + (it.danger ? ' danger' : ''));
    b.innerHTML = (it.icon ? ic(it.icon) : '') + `<span>${esc(it.label)}</span>` + (it.note ? `<small>${esc(it.note)}</small>` : '');
    b.onclick = () => { if (it.disabled) { if (it.note) toast(it.label + ': ' + it.note.toLowerCase()); return; } closeLayer(L); if (it.fn) it.fn(); };
    m.append(b);
  }
  L.append(m); place(m, anchor, 'auto');
  return L;
}
function popover(anchor, content, mode = 'center') { const L = layer(false); L.append(content); content.style.position = 'absolute'; place(content, anchor, mode); return L; }
function dialog(o) {
  return new Promise(res => {
    const L = layer(true), box = h('div', 'dlg');
    let done = false;
    const finish = v => { if (done) return; done = true; closeLayer(L); res(v); };
    L.onClose = () => { if (!done) { done = true; res(null); } };
    box.append(h('div', 'dlg-t', esc(o.title)));
    if (o.text) box.append(h('p', 'dlg-p', esc(o.text)));
    let inp = null;
    if (o.input !== undefined) { inp = h('input', 'dlg-in'); inp.id = 'dlgIn'; inp.value = o.input; inp.placeholder = o.placeholder || ''; inp.setAttribute('autocomplete', 'off'); box.append(inp); }
    if (o.body) box.append(o.body);
    const btns = h('div', 'dlg-b'), cancel = h('button', 'tbtn', 'ANNULLA'), ok = h('button', 'tbtn' + (o.danger ? ' danger' : ''), esc(o.ok || 'OK'));
    btns.append(cancel, ok); box.append(btns); L.append(box);
    cancel.onclick = () => finish(null);
    ok.onclick = () => { if (inp) { const v = inp.value.trim(); if (!v) { inp.focus(); return; } finish(v); } else finish(true); };
    if (inp) {
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok.click(); if (e.key === 'Escape') cancel.click(); });
      setTimeout(() => { inp.focus(); const n = inp.value.length; try { inp.setSelectionRange(n, n); } catch (_) {} }, 60);
    }
  });
}

function toast(msg, act, fn) {

}

    body.innerHTML = pages[settingsPage] || '';
  } else if (libMode === 'help') {
    body.innerHTML = `<div class="setp help"><div class="card"><dl>

      <dt>Spostare il foglio</dt><dd>Trascina con un dito.</dd>
      <dt>Zoom</dt><dd>Pizzica con due dita. Tocca la percentuale in basso per tornare al 100%. Il lucchetto blocca lo zoom.</dd>
      <dt>Torna al contenuto</dt><dd>Il mirino in basso a sinistra riporta al centro di quello che hai scritto.</dd>
      <dt>Opzioni di uno strumento</dt><dd>Tocca una volta per sceglierlo, una seconda volta per aprire tipo e spessore.</dd>

      <dt>Secchiello</dt><dd>Scegli il secchiello e tocca con la penna dentro un'area chiusa (un cerchio fatto a mano, una forma, una cella, una regione di una cartina): si colora sotto i tratti. Piccoli buchi nel contorno vengono ignorati; su un'area aperta o sullo spazio bianco non succede niente. Toccando un riempimento ne cambi il colore. Il secondo tocco sullo strumento sceglie Pieno o Chiaro. Se l'area esce dallo schermo, rimpicciolisci.</dd>
      <dt>Gomma precisa</dt><dd>Cancella solo il pezzo su cui passa, anche su forme, linee, frecce ed evidenziatore dritto. Una forma cancellata in parte diventa tratti; il suo riempimento resta.</dd>
      <dt>Scarabocchio e X</dt><dd>Uno zig-zag veloce o una X sopra una scritta la cancellano.</dd>
      <dt>Colori</dt><dd>Tocca di nuovo il colore attivo, o tienilo premuto, per modificarlo o eliminarlo. Il + aggiunge un colore.</dd>
      <dt>Testo</dt><dd>Con lo strumento tastiera tocca un punto e scrivi. Tocca un testo esistente per modificarlo. Il secondo tocco sullo strumento apre dimensione, grassetto e corsivo.</dd>
      <dt>Lazo</dt><dd>Disegna un giro attorno a ciò che vuoi selezionare, oppure tocca un singolo elemento. Trascina dentro il riquadro per spostare, usa gli angoli per ingrandire e il pallino blu in alto per ruotare.</dd>
      <dt>Incolla</dt><dd>Con il lazo, tocca un punto vuoto dopo aver copiato qualcosa.</dd>
      <dt>Forme</dt><dd>Scegli lo strumento Forme (o + in alto → Forme), poi trascina con la penna. Il secondo tocco sullo strumento apre forma, spessore, riempimento e tratteggio.</dd>
      <dt>Connettori</dt><dd>Con Forme scegli Linea, Freccia o Doppia freccia e traccia partendo o arrivando su una forma, una tabella, un'immagine o un testo: l'elemento si illumina e la linea resta agganciata, anche quando lo sposti, lo ingrandisci o lo ruoti. Tocca una linea o una freccia per selezionarla: trascina i due estremi dove vuoi (o la linea intera); se un estremo finisce su un elemento si aggancia, se lo porti fuori si sgancia. Gli estremi agganciati sono pieni.</dd>

      <dt>Puntatore laser</dt><dd>Indica con la penna: la scia rossa svanisce da sola e non lascia segni.</dd>
      <dt>I miei modelli</dt><dd>Seleziona qualcosa con il lazo e tocca Modello: gli dai un nome e lo ritrovi in + → Modelli, pronto da inserire in qualsiasi lavagna. Con ⋮ sul modello lo rinomini o lo elimini.</dd>
      <dt>Cercare</dt><dd>Con la lente della libreria cerchi nei nomi delle lavagne, nei testi scritti con la tastiera e nelle tabelle (non nella scrittura a mano). Tocca un risultato per aprire la lavagna proprio lì. Dentro una lavagna: ⋮ → Cerca nella lavagna, con le frecce per passare da un risultato all'altro.</dd>
      <dt>Esporta</dt><dd>Dal menu ⋮ della lavagna: PNG, PDF o file .boardlab. Un file .boardlab si riapre con il pulsante blu + della libreria.</dd>
      <dt>Lavagne e cartelle</dt><dd>Tieni premuto su una lavagna o su una cartella per le altre opzioni.</dd>
    </dl></div></div>`;
  }
}

/* ---- Azioni libreria ---- */
async function newBoard() {
  const f = curFolder(); if (!f) return;
  const name = await dialog({ title: 'Nuova lavagna', input: f.name + ' - ', placeholder: 'Nome della lavagna' });
  if (!name) return;
  const now = Date.now();
  const b = { id: uid(), folder: f.id, name, created: now, modified: now, deleted: 0, bg: '#FFFFFF' };
  meta.boards.push(b);
  await DB.set('b:' + b.id, { items: [], bg: NEW_BG(), view: null });
  saveMeta(); renderLibrary(); openBoard(b.id);
}
async function renameBoard(id) {
  const b = meta.boards.find(x => x.id === id); if (!b) return;
  const name = await dialog({ title: 'Rinomina', input: b.name });
  if (!name) return; b.name = name; saveMeta();
  if (ed && ed.b === b) renderEdHead(); else renderLibrary();
}
async function dupBoard(id) {
  const b = meta.boards.find(x => x.id === id); if (!b) return;
  const d = (await DB.get('b:' + id)) || { items: [], bg: NEW_BG() };
  const now = Date.now();
  const nb = { ...b, id: uid(), name: b.name + ' (copia)', created: now, modified: now };
  const th = THUMBS.get(b.id) || await DB.get('th:' + b.id); if (th) setThumb(nb.id, th);
  meta.boards.push(nb); await DB.set('b:' + nb.id, d); saveMeta(); renderLibrary(); toast('Lavagna duplicata');
}
async function moveBoard(id) {
  const b = meta.boards.find(x => x.id === id); if (!b) return;
  const to = await pickFolder('Sposta in…', b.folder);
  if (!to || to === b.folder) return;
  b.folder = to; saveMeta(); renderLibrary();
  toast('Spostata in ' + meta.folders.find(f => f.id === to).name);
}
function trashBoard(id) {
  const b = meta.boards.find(x => x.id === id); if (!b) return;
  b.deleted = Date.now(); saveMeta(); renderLibrary();
  toast('Lavagna spostata nel cestino', 'ANNULLA', () => { b.deleted = 0; saveMeta(); renderLibrary(); });
}
function boardMenu(anchor, id) {
  menu(anchor, [
    { label: 'Rinomina', icon: 'rename', fn: () => renameBoard(id) },
    { label: 'Duplica', icon: 'copy', fn: () => dupBoard(id) },
    { label: 'Sposta in…', icon: 'move', fn: () => moveBoard(id) },
    { sep: true },
    { label: 'Elimina', icon: 'trash', danger: true, fn: () => trashBoard(id) }
  ]);
}
async function newCollection() {

  if (!name) return;
  meta.collections.push({ id: uid(), name, open: true }); saveMeta(); renderLibrary();
}
async function newFolder(colId) {

async function renameFolder(id) {

}
async function colorFolder(id) {

async function moveFolder(id) {

  draw();

}
async function deleteFolder(id) {
  const f = meta.folders.find(x => x.id === id); if (!f) return;
  const bs = meta.boards.filter(b => b.folder === id && !b.deleted);
  const ok = await dialog({ title: 'Eliminare la cartella "' + f.name + '"?', text: bs.length ? `Le ${bs.length} lavagne che contiene finiranno nel cestino.` : 'La cartella è vuota.', ok: 'ELIMINA', danger: true });
  if (!ok) return;
  const now = Date.now(); bs.forEach(b => { b.deleted = now; });
  meta.folders = meta.folders.filter(x => x.id !== id);
  if (meta.ui.folder === id) meta.ui.folder = (meta.folders[0] || {}).id || null;
  saveMeta(); renderLibrary();
}
function folderMenu(anchor, id) {
  const items = [
    { label: 'Rinomina', icon: 'rename', fn: () => renameFolder(id) },
    { label: 'Colore', icon: 'palette', fn: () => colorFolder(id) }
  ];
  if (meta.collections.length > 1) items.push({ label: 'Sposta in un\'altra raccolta', icon: 'move', fn: () => moveFolder(id) });
  items.push({ sep: true }, { label: 'Elimina cartella', icon: 'trash', danger: true, fn: () => deleteFolder(id) });
  menu(anchor, items);
}
async function renameCollection(id) {
  const c = meta.collections.find(x => x.id === id); if (!c) return;
  const name = await dialog({ title: 'Rinomina raccolta', input: c.name });
  if (!name) return; c.name = name; saveMeta(); renderLibrary();
}
async function deleteCollection(id) {
  const c = meta.collections.find(x => x.id === id); if (!c) return;
  const fids = meta.folders.filter(f => f.col === id).map(f => f.id);
  const bs = meta.boards.filter(b => fids.includes(b.folder) && !b.deleted);
  const ok = await dialog({ title: 'Eliminare la raccolta "' + c.name + '"?', text: `Verranno eliminate ${fids.length} cartelle.` + (bs.length ? ` Le ${bs.length} lavagne finiranno nel cestino.` : ''), ok: 'ELIMINA', danger: true });
  if (!ok) return;
  const now = Date.now(); bs.forEach(b => { b.deleted = now; });
  meta.folders = meta.folders.filter(f => f.col !== id);
  meta.collections = meta.collections.filter(x => x.id !== id);
  if (!meta.folders.some(f => f.id === meta.ui.folder)) meta.ui.folder = (meta.folders[0] || {}).id || null;
  saveMeta(); renderLibrary();
}
function collMenu(anchor, id) {
  menu(anchor, [
    { label: 'Rinomina', icon: 'rename', fn: () => renameCollection(id) },
    { label: 'Nuova cartella', icon: 'folderPlus', fn: () => newFolder(id) },
    { sep: true },
    { label: 'Elimina raccolta', icon: 'trash', danger: true, fn: () => deleteCollection(id) }
  ]);
}
async function restoreBoard(id) {
  const b = meta.boards.find(x => x.id === id); if (!b) return;
  let f = meta.folders.find(x => x.id === b.folder);
  if (!f) {
    f = curFolder();
    if (!f) {
      let c = meta.collections[0];
      if (!c) { c = { id: uid(), name: 'Lavagne', open: true }; meta.collections.push(c); }
      f = { id: uid(), col: c.id, name: 'Ripristinate', color: '#90A4AE', created: Date.now() }; meta.folders.push(f);
    }
    b.folder = f.id;
  }
  b.deleted = 0; saveMeta(); renderLibrary(); toast('Ripristinata in ' + f.name);
}
async function purgeBoard(id) {
  const b = meta.boards.find(x => x.id === id); if (!b) return;
  const ok = await dialog({ title: 'Eliminare definitivamente?', text: `"${b.name}" verrà eliminata per sempre. Non si potrà recuperare.`, ok: 'ELIMINA', danger: true });
  if (!ok) return;
  meta.boards = meta.boards.filter(x => x.id !== id); await DB.del('b:' + id); dropThumb(id); saveMeta(); renderLibrary();
  gcImages();
}
async function emptyTrash() {
  const del = meta.boards.filter(b => b.deleted); if (!del.length) return;
  const ok = await dialog({ title: 'Svuotare il cestino?', text: `${del.length} lavagne verranno eliminate per sempre.`, ok: 'SVUOTA', danger: true });
  if (!ok) return;
  for (const b of del) { await DB.del('b:' + b.id); dropThumb(b.id); }
  meta.boards = meta.boards.filter(b => !b.deleted); saveMeta(); renderLibrary();
  gcImages();
}

/* ================= Lavagna: geometria degli elementi ================= */
/* Elementi: tratto { t:'pen'|'hl', k, c, w, p:Float32Array[x,y,pressione...] } · testo { t:'text', x, y (centro), s, c, b, i, r, txt } */
const GEOM = new WeakMap();
const NIB = -Math.PI / 4;
const TEXT_SIZES = [16, 22, 30, 40, 54, 72];
const FONT_STACK = 'Roboto, "Segoe UI", system-ui, -apple-system, sans-serif';
const measureC = document.createElement('canvas').getContext('2d');
const textFont = it => `${it.i ? 'italic ' : ''}${it.b ? 700 : 400} ${it.s}px ${FONT_STACK}`;
function geom(it) { let g = GEOM.get(it); if (g && it.t === 'conn' && !connFresh(it, g)) g = null; if (!g) { g = buildGeom(it); GEOM.set(it, g); } return g; }
function buildGeom(it) {
  if (it.t === 'text') return textGeom(it);
  if (it.t === 'shape') return shapeGeom(it);
  if (it.t === 'conn') return connGeom(it);
  if (it.t === 'table') return tableGeom(it);
  if (it.t === 'page' || it.t === 'image') return imageGeom(it);
  const p = it.p, n = Math.floor(p.length / 3);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i < n; i++) { const x = p[3 * i], y = p[3 * i + 1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const pad = it.w * (it.k === 'brush' ? 1 : 0.75) + 1;
  const g = { x0: x0 - pad, y0: y0 - pad, x1: x1 + pad, y1: y1 + pad };
  if (it.t === 'hl' || it.k === 'marker') { g.type = 'stroke'; g.path = centerPath(p, n); }
  else { g.type = 'fill'; Object.assign(g, outlinePath(it, p, n)); }
  return g;
}
function textLayout(it) {
  measureC.font = textFont(it);
  const lines = String(it.txt).split('\n');
  let w = 0; for (const l of lines) w = Math.max(w, measureC.measureText(l).width);
  const lh = it.s * 1.25;
  return { lines, w, h: lines.length * lh, lh };
}
function textGeom(it) {
  const L = textLayout(it), r = it.r || 0, cs = Math.cos(r), sn = Math.sin(r);
  const hw = Math.max(L.w, it.s * 0.35) / 2 + 4, hh = L.h / 2 + 4, xs = [], ys = [];
  for (const [a, b] of [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]]) { xs.push(it.x + a * cs - b * sn); ys.push(it.y + a * sn + b * cs); }
  return { type: 'text', L, hw, hh, x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
}
function toLocal(it, x, y) { const r = -(it.r || 0), dx = x - it.x, dy = y - it.y; return { x: dx * Math.cos(r) - dy * Math.sin(r), y: dx * Math.sin(r) + dy * Math.cos(r) }; }
function textHit(it, x, y, pad = 0) { const g = geom(it), l = toLocal(it, x, y); return Math.abs(l.x) <= g.hw + pad && Math.abs(l.y) <= g.hh + pad; }
/* Lettere del testo: riquadro di ogni carattere nelle coordinate locali del testo */
function textCharBoxes(it) {
  const g = geom(it); if (g.boxes) return g.boxes;
  measureC.font = textFont(it);
  const L = g.L, boxes = [];
  L.lines.forEach((line, li) => {
    const top = -L.h / 2 + li * L.lh; let prev = 0;
    for (let i = 0; i < line.length; i++) {
      const nx = measureC.measureText(line.slice(0, i + 1)).width;
      if (line[i] !== ' ') boxes.push({ key: li + ':' + i, x0: -L.w / 2 + prev, x1: -L.w / 2 + nx, y0: top + it.s * 0.12, y1: top + L.lh - it.s * 0.08 });
      prev = nx;
    }
  });
  return (g.boxes = boxes);
}
/* Cancella le lettere toccate e lascia lo spazio: il testo si divide in pezzi che restano esattamente al loro posto */
function eraseTextLetters(it, worldPts, r) {
  const loc = worldPts.map(p => toLocal(it, p.x, p.y)), hit = new Set();
  for (const b of textCharBoxes(it)) for (const q of loc) if (q.x >= b.x0 - r && q.x <= b.x1 + r && q.y >= b.y0 - r && q.y <= b.y1 + r) { hit.add(b.key); break; }
  return textRuns(it, hit);
}
function textRuns(it, hit) {
  if (!hit.size) return null;
  const L = geom(it).L, out = [], ang = it.r || 0, cs = Math.cos(ang), sn = Math.sin(ang);
  measureC.font = textFont(it);
  L.lines.forEach((line, li) => {
    let i = 0;
    while (i < line.length) {
      if (hit.has(li + ':' + i)) { i++; continue; }
      let j = i; while (j < line.length && !hit.has(li + ':' + j)) j++;
      let a = i, b = j; while (a < b && line[a] === ' ') a++; while (b > a && line[b - 1] === ' ') b--;
      if (b > a) {
        const txt = line.slice(a, b), wr = measureC.measureText(txt).width;
        const lx = -L.w / 2 + measureC.measureText(line.slice(0, a)).width + wr / 2, ly = -L.h / 2 + li * L.lh + L.lh / 2;
        out.push({ ...it, id: uid(), txt, x: it.x + lx * cs - ly * sn, y: it.y + lx * sn + ly * cs });
      }
      i = j;
    }

}
/* Lettere il cui centro cade dentro un riquadro (usato dalla X) */
function eraseTextInBox(it, box) {
  const r = it.r || 0, cs = Math.cos(r), sn = Math.sin(r), hit = new Set();
  for (const b of textCharBoxes(it)) {
    const lx = (b.x0 + b.x1) / 2, ly = (b.y0 + b.y1) / 2, x = it.x + lx * cs - ly * sn, y = it.y + lx * sn + ly * cs;
    if (x >= box.x0 && x <= box.x1 && y >= box.y0 && y <= box.y1) hit.add(b.key);
  }
  return textRuns(it, hit);
}
function segSamples(a, b, step) {
  const n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / Math.max(1, step))), out = [];
  for (let i = 0; i <= n; i++) out.push({ x: a.x + (b.x - a.x) * i / n, y: a.y + (b.y - a.y) * i / n });
  return out;
}
function textSegHit(it, a, b, r) {
  const n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / Math.max(2, r)));
  for (let i = 0; i <= n; i++) { const t = i / n; if (textHit(it, a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, r)) return true; }

}
function centerPath(p, n) {
  const path = new Path2D(); if (!n) return path;
  path.moveTo(p[0], p[1]);
  if (n === 1) { path.lineTo(p[0] + 0.01, p[1]); return path; }
  if (n === 2) { path.lineTo(p[3], p[4]); return path; }
  for (let i = 1; i < n - 1; i++) { const x = p[3 * i], y = p[3 * i + 1]; path.quadraticCurveTo(x, y, (x + p[3 * i + 3]) / 2, (y + p[3 * i + 4]) / 2); }
  path.lineTo(p[3 * n - 3], p[3 * n - 2]);

/* ================= Modelli personali ================= */

/* ================= Ricerca nel testo ================= */
/* Cerca nei testi scritti con la tastiera e nelle celle delle tabelle (non nella scrittura a mano).
   Senza distinzione tra maiuscole e minuscole né tra lettere accentate e non. */
function fold(s) {
  s = String(s); let o = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s[i], n = ch.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    o += n.length === 1 ? n : (ch.toLowerCase().length === 1 ? ch.toLowerCase() : ch);

}
function textEntries(items) {
  const out = [];
  for (const it of items) {
    if (it.t === 'text' && String(it.txt).trim()) out.push({ id: it.id, txt: String(it.txt) });
    else if (it.t === 'table' && it.cells) for (const k in it.cells) { const v = it.cells[k]; if (v && String(v).trim()) out.push({ id: it.id, cell: k, txt: String(v) }); }
  }
  return out;
}
function snippet(txt, fq) {
  const t = txt.replace(/\s+/g, ' '), f = fold(t), i = f.indexOf(fq); if (i < 0) return esc(t.slice(0, 80));
  const a = Math.max(0, i - 32), b = Math.min(t.length, i + fq.length + 48);
  return (a > 0 ? '…' : '') + esc(t.slice(a, i)) + '<mark>' + esc(t.slice(i, i + fq.length)) + '</mark>' + esc(t.slice(i + fq.length, b)) + (b < t.length ? '…' : '');
}
/* Indice in memoria, costruito solo quando si cerca e aggiornato solo per le lavagne modificate */
const SIDX = new Map(); let sIdxBusy = false;
async function ensureSearchIndex() {
  if (sIdxBusy) return;
  const todo = liveBoards().filter(b => { const c = SIDX.get(b.id); return !c || c.mod !== b.modified; });
  if (!todo.length) return;
  sIdxBusy = true;
  for (const b of todo) {
    try { const d = await DB.get('b:' + b.id); SIDX.set(b.id, { mod: b.modified, entries: textEntries((d && d.items) || []).map(e => ({ ...e, f: fold(e.txt) })) }); }
    catch (_) { SIDX.set(b.id, { mod: b.modified, entries: [] }); }
  }
  sIdxBusy = false;
  if (searching && !ed && libMode === 'folder') renderBody();
}

function renderSearch(body) {
  const q = searchQ.trim();
  if (!q) { body.innerHTML = `<div class="empty">Scrivi una parola: la cerco nei nomi delle lavagne, nei testi scritti con la tastiera e nelle tabelle.</div>`; return; }
  ensureSearchIndex();
  const fq = fold(q), res = [];
  for (const b of sortBoards(liveBoards())) {
    const hits = boardHits(b, fq);
    if (hits.length || fold(b.name).includes(fq)) res.push({ b, hits });
  }
  const pending = sIdxBusy ? '<p class="note">Cerco anche nei testi delle lavagne…</p>' : '';
  if (!res.length) { body.innerHTML = pending || `<div class="empty"><b>Nessun risultato</b>Nessuna lavagna contiene "${esc(q)}".</div>`; return; }
  body.innerHTML = pending + `<div class="blist">${res.map(({ b, hits }) => boardCard(b, true) + (hits.length ? `<div class="snips">${hits.slice(0, 3).map((e, n) =>
    `<button class="snip" data-act="open-hit" data-id="${b.id}" data-n="${n}">${ic(e.cell ? 'table' : 'kbd')}<span>${snippet(e.txt, fq)}</span></button>`).join('')}${hits.length > 3
    ? `<button class="snip more" data-act="open-hit" data-id="${b.id}" data-n="3"><span>${hits.length === 4 ? 'Un altro risultato' : `Altri ${hits.length - 3} risultati`} in questa lavagna</span></button>` : ''}</div>` : '')).join('')}</div>`;
}
async function openHit(id, n) {
  const q = searchQ.trim(), b = meta.boards.find(x => x.id === id); if (!b) return;
  const hits = q ? boardHits(b, fold(q)) : [], e = hits[n] || hits[0];
  await openBoard(id);

/* Barra di ricerca nella lavagna: evidenzia i risultati e li scorre uno alla volta */
let find = null;
function hitQuad(hh) {
  const it = ed.items.find(x => x.id === hh.id); if (!it) return null;
  const tf = localToWorld(it); let x0, y0, x1, y1;
  if (hh.cell) {
    const [ri, ci] = hh.cell.split(',').map(Number);
    if (!it.rows || ri >= it.rows.length || ci >= it.cols.length) return null;
    const r = cellRect(it, ri, ci); x0 = r.x; y0 = r.y; x1 = r.x + r.w; y1 = r.y + r.h;
  } else { const g = geom(it); x0 = -g.hw; y0 = -g.hh; x1 = g.hw; y1 = g.hh; }
  return [[x0, y0], [x1, y0], [x1, y1], [x0, y1]].map(([a, b]) => tf(a, b));
}
function findHits(q) {
  const fq = fold(q.trim()); if (!fq) return [];
  const out = [];
  for (const e of textEntries(ed.items)) {
    if (!fold(e.txt).includes(fq)) continue;
    const Q = hitQuad(e); if (!Q) continue;
    out.push({ ...e, cx: Q.reduce((s, p) => s + p[0], 0) / 4, cy: Q.reduce((s, p) => s + p[1], 0) / 4 });

}

  const n = $('#findN'); if (!find) return;
  n.textContent = !find.q.trim() ? '' : find.hits.length ? `${find.i + 1} di ${find.hits.length}` : 'Nessun risultato';
  n.classList.toggle('none', !!find.q.trim() && !find.hits.length);
}

  const hh = find.hits[find.i]; if (!hh) return;
  const Q = hitQuad(hh); if (!Q) return;
  const xs = Q.map(p => p[0]), ys = Q.map(p => p[1]), w = Math.max(...xs) - Math.min(...xs), hgt = Math.max(...ys) - Math.min(...ys);
  let z = cam.z;
  if (!meta.ui.zoomLock) {
    const fit = Math.min((SW - 80) / w, (SH - 160) / hgt);
    if (z > fit) z = Math.max(ZMIN, fit);
    else if (z < 0.6) z = Math.min(1, fit);
  }
  cam.z = z; cam.ox = SW / 2 - hh.cx * z; cam.oy = SH / 2 - hh.cy * z;
  updZoomLabel(); requestRender(); scheduleSave();
}
function openFind(q, focus, entry) {
  find = { q: q || '', hits: [], i: 0, items: null };
  $('#findBar').hidden = false; $('#findIn').value = find.q;
  refreshFind();
  if (entry) { const k = find.hits.findIndex(x => x.id === entry.id && (x.cell || '') === (entry.cell || '')); if (k >= 0) find.i = k; }
  if (find.hits.length) focusHit();
  updFindBar(); drawLive();
  if (focus) setTimeout(() => { const i = $('#findIn'); i.focus(); i.select(); }, 40);
}
function closeFind() { find = null; const b = $('#findBar'); if (b) { b.hidden = true; const i = $('#findIn'); if (document.activeElement === i) i.blur(); } if (ed) drawLive(); }
function stepFind(d) { if (!find || !find.hits.length) return; if (find.items !== ed.items) refreshFind(); find.i = (find.i + d + find.hits.length) % find.hits.length; focusHit(); updFindBar(); drawLive(); }
function drawFindHits(c) {
  if (find.items !== ed.items) { refreshFind(); updFindBar(); }
  find.hits.forEach((hh, k) => {
    const Q = hitQuad(hh); if (!Q) return;
    const cur = k === find.i, m = 3 / cam.z;
    const cx = hh.cx, cy = hh.cy;
    c.beginPath(); Q.forEach(([x, y], i) => { const dx = x - cx, dy = y - cy, L = Math.hypot(dx, dy) || 1; const px = x + dx / L * m, py = y + dy / L * m; i ? c.lineTo(px, py) : c.moveTo(px, py); }); c.closePath();
    c.fillStyle = cur ? 'rgba(255,152,0,0.20)' : 'rgba(255,214,0,0.20)'; c.fill();
    c.lineWidth = (cur ? 2.5 : 1.2) / cam.z; c.strokeStyle = cur ? '#FB8C00' : 'rgba(220,170,0,0.85)'; c.stroke();
  });
}

/* ================= Riconoscimento delle forme ================= */
/* Con la penna: disegni e tieni ferma la punta. Se il tratto somiglia a una forma diventa quella forma (con l'inclinazione
   con cui l'hai tracciata), altrimenti una linea dal punto di partenza a quello di arrivo. Solo calcoli geometrici, nessuna rete. */
const HOLD_MS = { short: 400, normal: 650, long: 1000 };

  d.holdT = setTimeout(() => { if (drawing === d && !d.recog) { const r = recognizeStroke(d.pts, d.item); if (r) { if (r.items && meta.settings.shapeGrid) r.items = r.items.map(gridAlign); d.recog = r; drawLive(); } } }, HOLD_MS[meta.settings.shapeHold] || 650);
}

  const hs = d.holdS, dd = hs ? Math.hypot(s.x - hs.x, s.y - hs.y) : Infinity;
  if (d.recog) { if (dd > 10) { d.recog = null; d.holdS = s; holdArm(d); } }
  else if (dd > 4) { d.holdS = s; holdArm(d); }

  'coll-menu': t => collMenu(t, t.dataset.id),
  'new-folder': t => newFolder(t.dataset.id),
  'open-folder': t => { meta.ui.folder = t.dataset.id; libMode = 'folder'; searching = false; searchQ = ''; if (innerWidth <= 720) meta.ui.drawer = false; saveMeta(); renderLibrary(); },
  'folder-menu': t => { const f = curFolder(); if (f) folderMenu(t, f.id); },
  'nav': t => {
    const v = t.dataset.v; searching = false;
    if (v === 'lib') { libMode = 'folder'; drawerMode = 'folders'; }
    else if (v === 'trash') { libMode = 'trash'; drawerMode = 'folders'; }
    else if (v === 'settings') { libMode = 'settings'; drawerMode = 'settings'; }
    else if (v === 'help') { libMode = 'help'; drawerMode = 'folders'; }
    renderLibrary();
  },
  'set-page': t => { settingsPage = t.dataset.v; libMode = 'settings'; renderLibrary(); },
  'set-ermax': t => { meta.settings.erMax = +t.dataset.v; saveMeta(); renderBody(); },
  'set-hold': t => { meta.settings.shapeHold = t.dataset.v; saveMeta(); renderBody(); },
  'toggle-setting': t => { const k = t.dataset.k; meta.settings[k] = !meta.settings[k]; saveMeta(); renderBody(); },
  'open-board': t => searching && searchQ.trim() ? openHit(t.dataset.id, 0) : openBoard(t.dataset.id),
  'open-hit': t => openHit(t.dataset.id, +t.dataset.n || 0),
  'find-prev': () => stepFind(-1),
  'find-next': () => stepFind(1),
  'find-close': () => closeFind(),
  'board-menu': t => boardMenu(t, t.dataset.id),
  'new-board': () => newBoard(),
  'fab-menu': t => menu(t, [{ label: 'Nuova lavagna', icon: 'plus', fn: newBoard }, { label: 'Apri PDF', icon: 'pdf', fn: () => $('#pdfIn').click() }, { label: 'Apri file .boardlab', icon: 'import', fn: () => $('#fileIn').click() }]),
  'search': () => { searching = true; searchQ = ''; renderLibrary(); setTimeout(() => { const i = $('#srchIn'); if (i) i.focus(); }, 30); },
  'search-close': () => { searching = false; searchQ = ''; renderLibrary(); },
  'view-toggle': () => { meta.settings.view = meta.settings.view === 'grid' ? 'list' : 'grid'; saveMeta(); renderMain(); },
  'sort-menu': t => menu(t, Object.entries(SORT_LABEL).map(([k, l]) => ({ label: l, icon: meta.settings.sort === k ? 'check' : null, fn: () => { meta.settings.sort = k; saveMeta(); renderMain(); } }))),
  'trash-restore': t => restoreBoard(t.dataset.id),
  'trash-del': t => purgeBoard(t.dataset.id),
  'trash-empty': () => emptyTrash(),
  'ed-back': () => closeBoard(false),
  'ed-rename': () => renameBoard(ed.b.id),
  'undo': () => undo(),
  'redo': () => redo(),
  'ed-insert': t => menu(t, [
    { label: 'Forme', icon: 'shapes', fn: () => { setTool('shape'); shapePopover($('.tb[data-tool="shape"]'), false); } },
    { label: 'Tabella', icon: 'table', fn: () => tablePicker(t) },
    ...(ed && ed.items.some(i => i.t === 'page') ? [{ label: 'Pagina bianca in fondo', icon: 'pageAdd', fn: addBlankPage }] : []),
    { label: 'Modelli', icon: 'template', fn: () => templatesMenu(t) },
    { sep: true },
    { label: guides.ruler ? 'Nascondi il righello' : 'Righello', icon: 'ruler', fn: () => toggleGuide('ruler') },
    { label: guides.prot ? 'Nascondi il goniometro' : 'Goniometro', icon: 'protractor', fn: () => toggleGuide('prot') },
    { sep: true },
    { label: 'Immagine', icon: 'image', fn: () => $('#imgIn').click() },
    { label: 'Scatta una foto', icon: 'camera', fn: () => $('#camIn').click() }
  ]),
  'ed-more': t => menu(t, [
    { label: 'Sfondo', icon: 'bg', fn: () => bgPopover(t) },
    { label: 'Rinomina', icon: 'rename', fn: () => renameBoard(ed.b.id) },
    { label: 'Cerca nella lavagna', icon: 'search', fn: () => openFind(find ? find.q : '', true) },
    { label: 'Cancella tutto', icon: 'trash', fn: clearAll },
    { sep: true },
    { label: 'Esporta…', icon: 'export', fn: exportDialog }
  ]),
  'zoom-reset': () => animateZoom(1),
  'zoom-lock': () => { meta.ui.zoomLock = !meta.ui.zoomLock; saveMeta(); updZoomLabel(); toast(meta.ui.zoomLock ? 'Zoom bloccato' : 'Zoom sbloccato'); },
  'zoom-fit': () => fitContent(),
  'page-menu': t => pageMenu(t)
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || !ACT[t.dataset.act]) return;
  ACT[t.dataset.act](t, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'srchIn') { searchQ = e.target.value; renderBody(); }
  else if (e.target.id === 'findIn' && find && ed) { find.q = e.target.value; find.i = 0; refreshFind(); if (find.hits.length) focusHit(); updFindBar(); drawLive(); }
});
document.addEventListener('keydown', e => {
  if (e.target.id !== 'findIn') return;
  if (e.key === 'Enter') { e.preventDefault(); stepFind(e.shiftKey ? -1 : 1); }
  else if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
});
function ctxOpen(t) {
  if (t.dataset.ctx === 'board') boardMenu(t, t.dataset.id);
  else if (t.dataset.ctx === 'folder') folderMenu(t, t.dataset.id);
  else if (t.dataset.ctx === 'sw') editSwatch(+t.dataset.i, t);
}
/* Pressione prolungata (500 ms) gestita dall'app, così funziona anche sopra le anteprime */
let lp = null;
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const t = e.target.closest('[data-ctx]'); if (!t || e.target.closest('.ib')) return;
  const x = e.clientX, y = e.clientY;
  t.classList.add('pressing');
  lp = { t, x, y, timer: setTimeout(() => {
    t.classList.remove('pressing'); lp = null;
    swallowUntil = performance.now() + 700; lpFired = performance.now();
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (_) {} }
    ctxOpen(t);
  }, 500) };
});
let lpFired = 0;
const lpCancel = () => { if (lp) { clearTimeout(lp.timer); lp.t.classList.remove('pressing'); lp = null; } };
document.addEventListener('pointermove', e => { if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) lpCancel(); });
document.addEventListener('pointerup', lpCancel);
document.addEventListener('pointercancel', lpCancel);
document.addEventListener('scroll', lpCancel, true);
document.addEventListener('contextmenu', e => {
  if (e.target.closest('input, textarea')) return;
  e.preventDefault();
  if (performance.now() - lpFired < 1000) return;
  const t = e.target.closest('[data-ctx]'); if (t && e.pointerType !== 'touch') { lpCancel(); ctxOpen(t); }
});
/* Doppio clic sul pulsante della penna: arriva come tasto "Unidentified" (pressione + rilascio). Il clic singolo arriva solo come rilascio e viene ignorato. */
let lastToggle = 0;
window.addEventListener('keydown', e => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const isPenBtn = e.key === 'Unidentified' || (!e.key && e.keyCode === 0);
  if (isPenBtn) {
    e.preventDefault();
    if (!ed || !meta.settings.dbl || $('#layers').children.length) return;
    const now = performance.now(); if (now - lastToggle < 250) return; lastToggle = now;
    toggleEraser(); return;
  }
  if (!ed) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel) { e.preventDefault(); deleteSel(); return; }
  if (e.key === 'Escape') { clearSel(); hidePasteBar(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); openFind(find ? find.q : '', true); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c' && sel) { copySel(); toast('Copiato'); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v' && clip) { if (meta.tool.tool !== 'lasso') setTool('lasso'); pasteClip(null); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
}, true);

/* ================= Avvio ================= */
(async function init() {
  $$('[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic); });
  let m = await DB.get('meta');
  if (!m || !m.v) {
    m = seedMeta();
    for (const b of m.boards) await DB.set('b:' + b.id, { items: [], bg: NEW_BG(), view: null });
    await DB.set('meta', m);
  }
  const d = seedMeta();
  m.settings = Object.assign({}, d.settings, m.settings);
  m.ui = Object.assign({}, d.ui, m.ui);
  m.tool = Object.assign({}, d.tool, m.tool);
  if (!Array.isArray(m.palette) || !m.palette.length) m.palette = DEFAULT_PALETTE.slice();
  // anteprime spostate fuori dall'elenco (versioni fino alla 0.6)
  let moved = false;
  for (const x of (m.boards || []).concat(m.tpls || [])) if ('thumb' in x) { if (x.thumb) { await DB.set('th:' + x.id, x.thumb); THUMBS.set(x.id, x.thumb); } delete x.thumb; moved = true; }
  if (moved) await DB.set('meta', m);
  meta = m;
  buildToolbar();
  renderLibrary();
  if (!meta.ui.lastGc || Date.now() - meta.ui.lastGc > 7 * 864e5) setTimeout(() => gcImages(), 8000);
})();
</script>

<div id="updBar" hidden><span>È disponibile una nuova versione di BoardLab</span><button id="updBtn">AGGIORNA</button></div>
<script>
/* Service worker: salva l'app sul tablet per l'uso senza rete. Gli aggiornamenti si installano solo quando tocchi AGGIORNA. */
(function () {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  let waiting = null, reloading = false;
  const bar = document.getElementById('updBar');
  const offer = w => { if (!navigator.serviceWorker.controller) return; waiting = w; bar.hidden = false; };
  document.getElementById('updBtn').onclick = async () => {
    bar.hidden = true;
    try { if (typeof ed !== 'undefined' && ed) { commitText(); await saveBoardNow(); } if (typeof meta !== 'undefined' && meta) await DB.set('meta', meta); } catch (_) {}
    if (waiting) waiting.postMessage('skipWaiting'); else location.reload();
  };
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading) return; reloading = true; location.reload(); });
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      if (reg.waiting) offer(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') offer(w); }); });
    } catch (_) {}
  });
})();
</script>
