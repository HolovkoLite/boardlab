<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="BoardLab: lavagna digitale per la penna">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>BoardLab</title>
<style>
/* Layout: app a schermo intero in stile Nebo — libreria (pannello laterale + elenco) e lavagna (barra titolo, barra strumenti, foglio infinito). Tema unico chiaro, scelto di proposito. */
:root {
  --blue: #2563EB;
  --blue-soft: #EAF1FE;
  --ink: #1E2430;
  --muted: #5B6472;
  --line: #E4E8EE;
  --pane: #F5F7FA;
  --white: #FFFFFF;
  --sel: #E9EDF2;
  --danger: #DC2626;
  --shadow: 0 6px 24px rgba(30, 36, 48, .18);
  --font: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--pane); color: var(--ink); font: 15px/1.35 var(--font);
  overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
input { font: inherit; color: inherit; }
#app { position: relative; height: 100%; overflow: hidden; }
.ic { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic .f { fill: currentColor; stroke: none; }
.ic .tip { fill: var(--tc, #000); stroke: none; }
.ic .tipl { stroke: var(--tc, #FFD83B); stroke-width: 3.2; }
.ib { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: #3D4654; flex: none; }
.ib:active { background: rgba(0,0,0,.06); }
.ib.sm { width: 36px; height: 36px; }
.ib.sm .ic { width: 20px; height: 20px; }
.ib:disabled { opacity: .3; cursor: default; }
.sp { flex: 1; }
.link { color: var(--blue); font-weight: 500; letter-spacing: .02em; }
.tbtn { color: var(--blue); font-weight: 500; letter-spacing: 0; padding: 10px 12px; border-radius: 10px; }
.tbtn.pri { background: var(--blue); color: #fff; border-radius: 20px; padding: 10px 20px; }
.tbtn.pri:active { background: #1D4ED8; }
.tbtn.pri.danger { background: var(--danger); color: #fff; }
.tbtn:active { background: var(--blue-soft); }
.tbtn.danger { color: var(--danger); }

/* ---------- Libreria ---------- */
#lib { position: absolute; inset: 0; display: flex; }
#drawer { width: 280px; flex: none; background: var(--white); display: flex; flex-direction: column; z-index: 5; }
.fold { display: flex; align-items: center; gap: 18px; padding: 0 14px 0 18px; height: 46px; border-radius: 10px; cursor: pointer; }
.fold.sel { background: var(--blue-soft); }
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.mn-head { display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 8px 0 16px; flex: none; }
.mn-head h1 { font-size: 20px; font-weight: 400; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mn-head .ib:first-child { margin-left: -8px; }
.chip { display: flex; align-items: center; gap: 8px; background: #E9EDF2; border-radius: 20px; padding: 0 14px 0 10px; height: 36px; font-size: 14px; }
.chip .ic { width: 20px; height: 20px; }
.mn-body { flex: 1; overflow-y: auto; padding: 4px 20px 96px; }
.blist { display: flex; flex-direction: column; gap: 4px; }
.bcard { display: flex; align-items: center; gap: 16px; padding: 6px 4px 6px 4px; border-radius: 10px; cursor: pointer; }
.bcard:active { background: rgba(0,0,0,.04); }
.thumb { width: 64px; height: 48px; border-radius: 4px; border: 1px solid #E4E8EE; overflow: hidden; flex: none; display: grid; place-items: center; }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; -webkit-user-drag: none; }
[data-ctx] { -webkit-touch-callout: none; touch-action: pan-y; }
.pressing { background: rgba(0,0,0,.07) !important; }
.bt { flex: 1; min-width: 0; }
.bn { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd { font-size: 13.5px; color: #5B6472; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bcard .ib { color: #5B6472; }
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
.bgrid .bcard { flex-direction: column; align-items: stretch; gap: 8px; padding: 8px; background: var(--white); position: relative; }
.bgrid .thumb { width: 100%; height: auto; aspect-ratio: 4 / 3; }
.bgrid .bt { padding: 0 32px 4px 4px; }
.bgrid .bcard .ib { position: absolute; right: 2px; bottom: 4px; }
.empty { text-align: center; color: var(--muted); padding: 64px 24px; font-size: 15px; line-height: 1.5; }
.empty b { display: block; color: #3D4654; font-size: 17px; font-weight: 500; margin-bottom: 4px; }
.fab { position: absolute; right: 24px; bottom: 24px; width: 60px; height: 60px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(37,99,235,.45); }
.fab .ic { width: 28px; height: 28px; stroke-width: 2.2; }
.trow-b { display: flex; align-items: center; gap: 16px; padding: 6px 4px; }
.note { font-size: 13px; color: var(--muted); margin: 0 0 12px 4px; }
.trow { display: flex; align-items: center; gap: 16px; background: var(--white); border-radius: 12px; padding: 14px 16px; text-align: left; width: 100%; }
.trow b { display: block; font-weight: 500; font-size: 15.5px; }
.trow small { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.trow > span:first-child { flex: 1; }
.trow { box-sizing: border-box; }
.trow.col { flex-direction: column; align-items: stretch; gap: 12px; }
.tg { width: 40px; height: 22px; border-radius: 11px; background: #C9CFD8; position: relative; flex: none; transition: background .15s; }
.tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
.tg.on { background: var(--blue); }
.tg.on::after { transform: translateX(18px); }
.help dl { margin: 0; display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 10px 20px; }
.help dt { font-weight: 500; }
.help dd { margin: 0; color: #3D4654; }

/* ---------- Lavagna ---------- */
#editor { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--white); }
.ed-titles { display: flex; flex-direction: column; align-items: flex-start; padding: 2px 8px; border-radius: 8px; min-width: 0; max-width: 60%; text-align: left; }
#edTitle { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
#edSub { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
#edSub .dot { width: 10px; height: 10px; border-radius: 2px; }
.tb { width: 44px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: #1E2430; flex: none; }
.tb.on { background: var(--sel); }
.tb .ic { width: 26px; height: 26px; }
.sw { width: 30px; height: 30px; border-radius: 50%; background: var(--c); display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); color: #fff; }
.sw .ic { width: 18px; height: 18px; stroke-width: 2.6; opacity: 0; }
.sw.on .ic { opacity: 1; }
.sw.lt { color: #1E2430; }
.sw.add { background: none; box-shadow: none; border: 1.5px dashed #A9B1BC; color: #5B6472; box-sizing: border-box; margin-left: 6px; }
.sw.add .ic { opacity: 1; stroke-width: 2; }
.sw.big { width: 36px; height: 36px; }
#stage { flex: 1; position: relative; overflow: hidden; touch-action: none; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pgpill { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--white); border-radius: 23px; box-shadow: 0 2px 10px rgba(0,0,0,.16); z-index: 2; }
.pgpill button { height: 46px; padding: 0 20px; font-size: 15px; color: #3D4654; white-space: nowrap; }
.zpill { position: absolute; left: 16px; bottom: 16px; display: flex; background: var(--white); border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.16); overflow: hidden; z-index: 2; }
.zpill button { height: 46px; min-width: 52px; padding: 0 12px; display: grid; place-items: center; color: var(--blue); }
.zpill button + button { border-left: 1px solid #E4E8EE; }
#zLabel { font-size: 15px; min-width: 64px; font-variant-numeric: tabular-nums; }
#zLock { color: #5B6472; }
#zLock.on { color: var(--blue); }
.zpill .ic { width: 22px; height: 22px; }

/* ---------- Livelli: menu, popover, dialoghi ---------- */
.layer { position: fixed; inset: 0; z-index: 50; }
.layer.dim { background: rgba(0,0,0,.32); display: grid; place-items: center; padding: 16px; }
.menu, .pop { position: absolute; background: var(--white); border-radius: 6px; box-shadow: var(--shadow); }
.menu { min-width: 220px; padding: 8px 0; }
.menu-i { display: flex; align-items: center; gap: 16px; width: 100%; padding: 0 20px; height: 48px; text-align: left; font-size: 16px; }
.menu-i:active { background: rgba(0,0,0,.05); }
.menu-i .ic { color: #3D4654; width: 22px; height: 22px; }
.menu-i span { flex: 1; }
.menu-i small { font-size: 12px; color: var(--muted); }
.menu-i.dis { color: #A9B1BC; }
.menu-i.dis .ic { color: #A9B1BC; }
.menu-i.danger, .menu-i.danger .ic { color: var(--danger); }
.menu-sep { height: 1px; background: var(--line); margin: 6px 0; }
.pop { padding: 18px 20px 20px; }
.pop-h { display: flex; align-items: center; gap: 4px; font-size: 19px; margin-bottom: 14px; }
.lbl { font-size: 13px; color: var(--muted); margin: 12px 0 8px; }
.seg { display: flex; gap: 6px; }
.seg-b { flex: 1; min-width: 104px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; border-radius: 8px; font-size: 15px; color: #3D4654; }
.seg-b.on { background: var(--sel); color: var(--ink); }
.seg-b .ic { width: 26px; height: 26px; color: #1E2430; }
.abc { font-weight: 700; font-size: 17px; color: #1E2430; padding: 0 3px; line-height: 26px; }
.abc.free { background: linear-gradient(170deg, transparent 30%, rgba(160,160,160,.55) 30%, rgba(160,160,160,.55) 75%, transparent 75%); }
.sizes { display: flex; justify-content: space-between; margin: 14px 4px 4px; }
.sz { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; }
.sz.on { background: var(--sel); }
.sz i { display: block; border-radius: 50%; background: #5B6472; }
.try { position: relative; margin-top: 14px; border: 1px solid #E4E8EE; border-radius: 6px; overflow: hidden; }
.try canvas { display: block; touch-action: none; background: #fff; }
.cpick { width: 300px; box-sizing: border-box; }
.ring { position: relative; width: 190px; height: 190px; margin: 4px auto 6px; touch-action: none; }
.ring-g { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(#f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); -webkit-mask: radial-gradient(circle, transparent 60%, #000 61%); mask: radial-gradient(circle, transparent 60%, #000 61%); }
.ring-c { position: absolute; inset: 40px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.ring-k { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); box-sizing: border-box; pointer-events: none; }
.rng { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 4px; outline: none; margin: 4px 0; }
.rng::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--blue); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.rng::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--blue); border: 3px solid #fff; }
.bgc { display: flex; flex-wrap: wrap; gap: 8px; max-width: 330px; }
.pats { display: flex; gap: 8px; }
.pat { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; border-radius: 8px; font-size: 13.5px; color: #3D4654; }
.pat.on { background: var(--sel); color: var(--ink); }
.pv { width: 62px; height: 44px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.pv-lines { background-image: linear-gradient(rgba(0,0,0,.18) 1px, transparent 1px); background-size: 100% 10px; }
.pv-grid { background-image: linear-gradient(rgba(0,0,0,.15) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.15) 1px, transparent 1px); background-size: 8px 8px; }
.pv-dots { background-image: radial-gradient(rgba(0,0,0,.35) 1px, transparent 1.4px); background-size: 8px 8px; }
.dlg { background: var(--white); border-radius: 6px; box-shadow: var(--shadow); width: min(560px, 100%); padding: 22px 24px 12px; box-sizing: border-box; }
.dlg-t { font-size: 17px; margin-bottom: 18px; }
.dlg-p { margin: 0 0 8px; color: #3D4654; line-height: 1.5; }
.dlg-in { width: 100%; box-sizing: border-box; border: 0; outline: 0; height: 46px; padding: 0 14px; font-size: 16px; background: #F1F4F8; border-radius: 12px; color: var(--ink); box-shadow: inset 0 0 0 1.5px transparent; }
.dlg-in:focus { background: #fff; box-shadow: inset 0 0 0 1.5px var(--blue); }
.dlg-b { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
.fcols { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.fcol { width: 36px; height: 36px; border-radius: 50%; background: var(--c); display: grid; place-items: center; color: #fff; }
.fcol .ic { width: 20px; height: 20px; stroke-width: 2.6; opacity: 0; }
.fcol.on .ic { opacity: 1; }
.pick { max-height: 50vh; overflow-y: auto; margin: 0 -8px; }
.pick-c { font-size: 13px; color: var(--muted); padding: 10px 12px 4px; }
.pick-f { display: flex; align-items: center; gap: 14px; width: 100%; padding: 0 12px; height: 44px; border-radius: 8px; text-align: left; font-size: 16px; }
.pick-f.on { background: var(--blue-soft); }
.pick-f .ic { color: var(--fc); }
#toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #1E2430; color: #fff; border-radius: 8px; padding: 12px 18px; display: flex; align-items: center; gap: 18px; font-size: 14.5px; z-index: 80; box-shadow: var(--shadow); max-width: calc(100% - 32px); box-sizing: border-box; }
#toast .link { color: #93B4F8; }
#txtEd { position: absolute; z-index: 3; margin: 0; padding: 0; border: 0; outline: 1.5px dashed rgba(37,99,235,.75); outline-offset: 4px; background: transparent; resize: none; overflow: hidden; white-space: pre; font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif; transform-origin: 0 0; box-sizing: content-box; caret-color: var(--blue); -webkit-user-select: text; user-select: text; }
.selbar { position: absolute; z-index: 4; display: flex; gap: 2px; background: #E4E8EE; border-radius: 24px; box-shadow: 0 4px 16px rgba(30,36,48,.2); padding: 4px; white-space: nowrap; }
.selbar button { height: 40px; padding: 0 14px; border-radius: 20px; font-size: 15px; color: #3D4654; }
.selbar button:active { background: rgba(0,0,0,.08); }
.selbar .danger { color: var(--danger); }
.findbar { position: absolute; z-index: 5; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; background: var(--white); border-radius: 24px; box-shadow: 0 4px 16px rgba(30,36,48,.2); padding: 2px 4px 2px 14px; width: min(520px, calc(100% - 24px)); box-sizing: border-box; color: var(--muted); }
.findbar input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; color: var(--ink); height: 40px; padding: 0 8px; }
.findbar #findN { font-size: 13px; color: var(--muted); white-space: nowrap; padding: 0 6px; }
.findbar #findN.none { color: var(--danger); }
.tplpop { width: min(560px, calc(100vw - 16px)); max-height: calc(100vh - 16px); overflow: auto; box-sizing: border-box; padding-bottom: 10px; }
.tpl-sec { display: flex; align-items: center; gap: 8px; width: calc(100% + 16px); margin: 0 -8px 8px; padding: 0 8px; height: 40px; border-radius: 8px; text-align: left; font-size: 13px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tpl-sec:active { background: rgba(0,0,0,.05); }
.tpl-sec .ic { width: 20px; height: 20px; flex: none; }
.tpl-sec span { flex: 1; }
.tpl-sec small { font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: none; background: #EEF1F4; border-radius: 10px; padding: 2px 8px; }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.tpl { border-radius: 8px; cursor: pointer; padding: 6px; background: #F4F6F8; }
.tpl:active { background: #E8ECEF; }
.tpl .thumb { width: 100%; height: auto; aspect-ratio: 4 / 3; background: #FFFFFF; }
.tpl-f { display: flex; align-items: center; gap: 2px; padding: 4px 0 0 4px; }
.tpl-n { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tpl-empty { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
.tpl-list { margin: 0 -20px; }
.snips { display: flex; flex-direction: column; gap: 2px; margin: -2px 0 10px 84px; }
.snip { display: flex; align-items: center; gap: 10px; text-align: left; padding: 7px 10px; border-radius: 8px; font-size: 14px; color: #3C4146; line-height: 1.35; }
.snip:active { background: rgba(0,0,0,.05); }
.snip .ic { width: 18px; height: 18px; color: #5B6472; flex: none; }
.snip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.snip mark { background: #FFE082; color: inherit; border-radius: 3px; padding: 0 1px; }
.snip.more { color: var(--blue); padding-left: 38px; }
.fmt { display: flex; gap: 8px; }
.fmt-b { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; height: 46px; border-radius: 8px; font-size: 15px; color: #3D4654; }
.fmt-b b, .fmt-b i { font-size: 20px; color: #1E2430; font-family: Georgia, serif; }
.fmt-b.on { background: var(--sel); color: var(--ink); }
.ptxt { width: 380px; box-sizing: border-box; }
.fonts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.fnt { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 10px 10px; border-radius: 8px; text-align: left; min-width: 0; }
.fnt span { font-size: 17px; color: #1E2430; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.fnt small { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.fnt.on { background: var(--sel); }
.ptrow { display: flex; align-items: center; justify-content: center; gap: 18px; }
.ptv { font-size: 18px; min-width: 92px; height: 40px; border-radius: 8px; text-align: center; font-variant-numeric: tabular-nums; background: var(--pane); }
.ptin { width: 92px; height: 40px; box-sizing: border-box; border: 0; border-bottom: 2px solid var(--blue); outline: 0; background: none; font: inherit; font-size: 18px; text-align: center; }
.pts { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; margin-top: 6px; }
.fmt4 .fmt-b { gap: 0; }
.fmt-b u, .fmt-b s { font-size: 20px; color: #1E2430; font-family: Georgia, serif; }
.expo .exp-l { font-size: 14px; color: var(--blue); margin: 16px 0 4px; }
.expo .exp-l:first-child { margin-top: 0; }
.exp-rows { margin-top: 6px; }
.exp-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; padding: 13px 2px; font-size: 16px; text-align: left; }
.exp-out { margin: 8px 2px 0; font-size: 13px; color: var(--muted); }
.dlg-p { white-space: pre-line; }
.exp-row small.dim { color: var(--muted); font-size: 13px; }
.drv-act { display: flex; justify-content: flex-end; margin-top: 12px; }
.drv-opt { display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 2px; text-align: left; }
.drv-opt b { display: block; font-weight: 500; font-size: 15.5px; }
.drv-opt small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.drv-opt .rb { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #A9B1BC; box-sizing: border-box; flex: none; }
.drv-opt.on .rb { border-color: var(--blue); background: var(--blue); box-shadow: inset 0 0 0 3px #fff; }
.drvd #drvLink { margin: 4px 0 6px 34px; width: calc(100% - 34px); }
.drv-unl { display: block; margin-top: 14px; font-size: 14px; color: var(--danger); }
.drv-bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin: 14px 0 2px; }
.drv-bar i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .3s; }

/* Astuccio */
.ast { position: absolute; z-index: 7; background: #1E2430; color: #E7EBF0; border-radius: 26px; box-shadow: 0 12px 32px rgba(30,36,48,.30); display: flex; align-items: center; touch-action: none; scrollbar-width: none; box-sizing: border-box; }
.ast::-webkit-scrollbar { display: none; }
.ast.v { flex-direction: column; width: 72px; padding: 6px 0 8px; max-height: calc(100% - 168px); }
.ast.h { flex-direction: row; height: 72px; padding: 0 8px 0 6px; max-width: calc(100% - 48px); }
.ast.scroll.v { overflow-y: auto; overflow-x: hidden; }
.ast.scroll.h { overflow-x: auto; overflow-y: hidden; }
.ast.right { right: 16px; top: 50%; transform: translateY(-50%); }
.ast.left { left: 16px; top: 50%; transform: translateY(-50%); }
.ast.top { top: 16px; left: 50%; transform: translateX(-50%); }
.ast.above { z-index: 55; }
.ast.bottom { bottom: 16px; left: 50%; transform: translateX(-50%); }
.ast.closed.v { max-height: none; }
.ast.free, .ast.dragging { right: auto; bottom: auto; transform: none; }
.ast.dragging { opacity: .92; box-shadow: 0 18px 40px rgba(30,36,48,.38); transition: none; }
.ast .grip { flex: none; display: grid; grid-template-columns: repeat(3, 4px); gap: 4px; padding: 13px 18px; cursor: grab; touch-action: none; }
.ast.h .grip { grid-template-columns: repeat(2, 4px); padding: 18px 12px; }
.ast .grip i { width: 4px; height: 4px; border-radius: 50%; background: #7D8694; }
.ast .ab { flex: none; width: 56px; height: 50px; border-radius: 16px; display: grid; place-items: center; color: inherit; }
.ast.h .ab { width: 50px; height: 56px; }
.ast .ab .ic { width: 24px; height: 24px; }
.ast .ab.sm { height: 40px; color: #A9B1BC; }
.ast.h .ab.sm { width: 40px; height: 56px; }
.ast .ab.on:not(.pen) { background: #3A4454; box-shadow: inset 0 0 0 1.5px #5B6576; color: #fff; }
.ast .penic { overflow: visible; transition: transform .16s ease; }
.ast.left .penic { transform: scaleX(-1); }
.ast.top .penic { transform: rotate(-90deg); }
.ast.bottom .penic { transform: rotate(90deg); }
/* penna attiva: lo stesso riquadro degli strumenti attivi e una lineetta del suo colore dalla parte del foglio */
.ast .pen.on { position: relative; background: #3A4454; box-shadow: inset 0 0 0 1.5px #5B6576; }
.ast .pen.on::after { content: ''; position: absolute; background: var(--pc); border-radius: 2px; box-shadow: 0 0 0 1px rgba(255,255,255,.28); }
.ast.right .pen.on::after { left: -5px; top: 12px; bottom: 12px; width: 3px; }
.ast.left .pen.on::after { right: -5px; top: 12px; bottom: 12px; width: 3px; }
.ast.top .pen.on::after { bottom: -5px; left: 12px; right: 12px; height: 3px; }
.ast.bottom .pen.on::after { top: -5px; left: 12px; right: 12px; height: 3px; }
.ast.h .penic { flex: none; }

/* Cassetto: esce da dietro l'astuccio; i colori stanno in un vassoio chiaro */
.pop.drw { width: 470px; box-sizing: border-box; background: #1E2430; color: #E7EBF0; border-radius: 24px; box-shadow: 0 12px 32px rgba(30,36,48,.28); padding: 14px 20px 18px; }

/* Colori */
function hex2rgb(hex) { const v = hex.replace('#', ''); const n = parseInt(v.length === 3 ? v.split('').map(c => c + c).join('') : v, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgb2hex(r, g, b) { return '#' + [r, g, b].map(x => Math.round(clamp(x, 0, 255)).toString(16).padStart(2, '0')).join('').toUpperCase(); }
function isLight(hex) { const [r, g, b] = hex2rgb(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.62; }
function hsv2hex(hh, s, v) { const f = n => { const k = (n + hh / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); }; return rgb2hex(f(5) * 255, f(3) * 255, f(1) * 255); }
function hex2hsv(hex) { let [r, g, b] = hex2rgb(hex).map(x => x / 255); const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let hh = 0; if (d) { if (mx === r) hh = ((g - b) / d) % 6; else if (mx === g) hh = (b - r) / d + 2; else hh = (r - g) / d + 4; hh *= 60; if (hh < 0) hh += 360; } return [hh, mx ? d / mx : 0, mx]; }

/* ================= Archivio (IndexedDB con riserva in memoria) ================= */
const DB = (() => {
  const mem = new Map(); let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise(res => {
      const t = setTimeout(() => res(null), 2500);
      try {
        const r = indexedDB.open('boardlab', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { clearTimeout(t); res(r.result); };
        r.onerror = r.onblocked = () => { clearTimeout(t); res(null); };
      } catch (e) { clearTimeout(t); res(null); }
    });
    return dbp;
  }
  async function get(k) {
    const db = await open(); if (!db) return mem.get(k);
    return new Promise(res => { try { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result === undefined ? mem.get(k) : q.result); q.onerror = () => res(mem.get(k)); } catch (e) { res(mem.get(k)); } });
  }
  async function set(k, v) {
    mem.set(k, v); const db = await open(); if (!db) return;
    return new Promise(res => {
      const fail = err => { const n = err && err.name; res(n === 'QuotaExceededError' || /quota/i.test(String(err && err.message)) ? 'quota' : false); if (typeof warnSave === 'function') warnSave(n === 'QuotaExceededError' || /quota/i.test(String(err && err.message))); };
      try { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(true); tx.onerror = tx.onabort = () => fail(tx.error); } catch (e) { fail(e); }
    });
  }
  async function del(k) {
    mem.delete(k); const db = await open(); if (!db) return;
    return new Promise(res => { try { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = tx.onerror = tx.onabort = () => res(); } catch (e) { res(); } });
  }
  async function keys(prefix) {
    const db = await open();
    const all = db ? await new Promise(res => { try { const q = db.transaction('kv').objectStore('kv').getAllKeys(IDBKeyRange.bound(prefix, prefix + '\uffff')); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); } catch (e) { res([]); } }) : [];
    return [...new Set(all.concat([...mem.keys()].filter(k => typeof k === 'string' && k.startsWith(prefix))))];
  }
  return { get, set, del, keys };
})();

/* ================= Anteprime e pulizia dell'archivio ================= */
/* Le anteprime stanno fuori dall'elenco delle lavagne, sotto 'th:<id>': l'elenco resta piccolo e i salvataggi automatici leggeri.
   Si caricano solo quando servono e restano in memoria. */
const THUMBS = new Map(), thLoading = new Set();
function thumbImg(id) {
  const u = THUMBS.get(id); if (u === undefined) loadThumb(id);
  return `<img data-th="${id}" alt="" draggable="false"${u ? ` src="${u}"` : ' hidden'}>`;
}
function showThumb(id) { const u = THUMBS.get(id); document.querySelectorAll(`img[data-th="${id}"]`).forEach(im => { if (u) { im.src = u; im.hidden = false; } else { im.removeAttribute('src'); im.hidden = true; } }); }
async function loadThumb(id) {
  if (thLoading.has(id)) return; thLoading.add(id);
  let u = null; try { u = (await DB.get('th:' + id)) || null; } catch (_) {}
  thLoading.delete(id);
  if (!THUMBS.has(id)) THUMBS.set(id, u);
  showThumb(id);
}
function setThumb(id, u) { THUMBS.set(id, u || null); if (u) DB.set('th:' + id, u); else DB.del('th:' + id); showThumb(id); }
function dropThumb(id) { THUMBS.delete(id); DB.del('th:' + id); }
/* Immagini e pagine PDF non più usate da nessuna lavagna (cestino compreso), da nessun modello e dagli appunti: vengono eliminate.
   Si fa quando elimini definitivamente qualcosa e, al massimo una volta alla settimana, all'avvio. */
let gcBusy = false;
async function gcImages() {
  if (gcBusy) return 0; gcBusy = true;
  let n = 0;
  try {
    const keys = await DB.keys('img:'); if (!keys.length) return 0;
    const used = new Set(), add = items => { for (const it of items || []) if (it && it.img) used.add(it.img); };
    for (const b of meta.boards.slice()) { const d = await DB.get('b:' + b.id); add(d && d.items); }
    for (const t of (meta.tpls || []).slice()) { const d = await DB.get('tpl:' + t.id); add(d && d.items); }
    add(clip);
    if (ed) { add(ed.items); for (const hh of ed.hist.concat(ed.fut)) { add(hh.b); add(hh.a); } }
    for (const k of keys) {
      const id = k.slice(4); if (used.has(id)) continue;
      await DB.del(k); n++;
      const e = IMG.get(id); if (e) { try { e.el && e.el.close && e.el.close(); } catch (_) {} IMG.delete(id); }
    }
    meta.ui.lastGc = Date.now(); saveMeta();
  } catch (_) {} finally { gcBusy = false; }
  return n;
}

/* ---- Esportazione di più lavagne: tutte insieme nel menu Condividi ---- */
async function exportMany(ids) {
  const S = meta.settings.exp || (meta.settings.exp = { fmt: 'pdf', col: true, pat: true });
  const st = { fmt: S.fmt || 'pdf' };
  const body = h('div', 'expo');
  const drawF = () => { body.innerHTML = `<div class="exp-l">Formato</div><div class="seg2 fmtseg" id="expFmtM">${[['png', 'PNG'], ['pdf', 'PDF'], ['boardlab', 'BoardLab']].map(([v, l]) => `<button class="${st.fmt === v ? 'on' : ''}" data-fmt="${v}">${l}</button>`).join('')}</div>`; };
  drawF();
  body.addEventListener('click', e => { const f = e.target.closest('[data-fmt]'); if (f) { st.fmt = f.dataset.fmt; drawF(); } });
  const ok = await dialog({ title: ids.length === 1 ? 'Esporta la lavagna' : `Esporta ${ids.length} lavagne`, body, ok: 'Esporta' });
  if (!ok) return;
  S.fmt = st.fmt; saveMeta();
  toast('Preparo i file…');
  const files = [];
  for (const id of ids) {
    const b = meta.boards.find(x => x.id === id); if (!b) continue;
    const d = (await DB.get('b:' + id)) || { items: [], bg: NEW_BG() }, items = d.items || [];
    if (st.fmt !== 'boardlab' && !items.length) continue;
    const prev = connScope; connScope = new Map(items.map(i => [i.id, i]));
    try { const blob = await buildFile(items, d.bg || NEW_BG(), st.fmt, { col: S.col !== false, pat: S.pat !== false, name: b.name }); if (blob) files.push({ blob, name: fileSafe(b.name) + '.' + st.fmt }); }
    catch (_) { toast('Non riesco a creare il PDF'); }
    finally { connScope = prev; }
  }
  deliverFiles(files);
}
async function deliverFiles(list) {
  if (!list.length) { toast('Non c\'è niente da esportare'); return; }
  if (list.length === 1) { deliverFile(list[0].blob, list[0].name); return; }
  const fs = list.map(x => shareFile(x.blob, x.name));
  if (fs.every(Boolean) && navigator.canShare && navigator.canShare({ files: fs })) {
    const share = async () => { try { await navigator.share({ files: fs }); return true; } catch (e) { return e && e.name === 'AbortError' ? true : e && e.name === 'NotAllowedError' ? null : false; } };
    let r = await share();
    if (r === null) { const ok = await dialog({ title: 'I file sono pronti', text: list.length + ' file', ok: 'Condividi' }); if (!ok) return; r = await share(); }
    if (r === true) return;
  }
  for (const x of list) await downloadBlob(x.blob, x.name);
}
async function drvSendBoards(ids) {
  const byF = new Map();
  for (const id of ids) { const b = meta.boards.find(x => x.id === id); if (b) { if (!byF.has(b.folder)) byF.set(b.folder, []); byF.get(b.folder).push(b.id); } }
  const linked = [...byF.keys()].filter(fid => { const f = meta.folders.find(x => x.id === fid); return f && f.drive; });
  if (!linked.length) { drvFolderDialog([...byF.keys()][0]); return; }
  for (const fid of linked) await drvSync(fid, byF.get(fid));
}

/* ================= Modelli personali ================= */
/* Una selezione salvata come modello: elementi centrati in 0,0 sotto 'tpl:<id>', elenco (nome, anteprima) in meta.tpls.

/* ================= Ricerca nel testo ================= */
/* Cerca nei testi scritti con la tastiera e nelle celle delle tabelle (non nella scrittura a mano).
   Senza distinzione tra maiuscole e minuscole né tra lettere accentate e non. */
function fold(s) {
  s = String(s); let o = '';

}

  const out = [];
  for (const it of items) {
    if (it.t === 'text' && String(it.txt).trim()) out.push({ id: it.id, txt: String(it.txt) });
    else if (it.t === 'table' && it.cells) for (const k in it.cells) { const v = it.cells[k]; if (v && String(v).trim()) out.push({ id: it.id, cell: k, txt: String(v) }); }
  }

}

  const a = Math.max(0, i - 32), b = Math.min(t.length, i + fq.length + 48);
  return (a > 0 ? '…' : '') + esc(t.slice(a, i)) + '<mark>' + esc(t.slice(i, i + fq.length)) + '</mark>' + esc(t.slice(i + fq.length, b)) + (b < t.length ? '…' : '');
}
/* Indice in memoria, costruito solo quando si cerca e aggiornato solo per le lavagne modificate */
const SIDX = new Map(); let sIdxBusy = false;
async function ensureSearchIndex() {
  if (sIdxBusy) return;
  const todo = liveBoards().filter(b => { const c = SIDX.get(b.id); return !c || c.mod !== b.modified; });
  if (!todo.length) return;
  sIdxBusy = true;
  for (const b of todo) {
    try { const d = await DB.get('b:' + b.id); SIDX.set(b.id, { mod: b.modified, entries: textEntries((d && d.items) || []).map(e => ({ ...e, f: fold(e.txt) })) }); }
    catch (_) { SIDX.set(b.id, { mod: b.modified, entries: [] }); }
  }
  sIdxBusy = false;
  if (searching && !ed && libMode === 'folder') renderBody();
}

  const q = searchQ.trim();
  if (!q) { body.innerHTML = ''; return; }
  ensureSearchIndex();
  const fq = fold(q), res = [];
  for (const b of sortBoards(liveBoards())) {
    const hits = boardHits(b, fq);
    if (hits.length || fold(b.name).includes(fq)) res.push({ b, hits });
  }
  const pending = '';
  if (!res.length) { body.innerHTML = pending || `<div class="empty"><b>Nessun risultato</b></div>`; return; }
  body.innerHTML = pending + `<div class="blist">${res.map(({ b, hits }) => boardCard(b, true) + (hits.length ? `<div class="snips">${hits.slice(0, 3).map((e, n) =>
    `<button class="snip" data-act="open-hit" data-id="${b.id}" data-n="${n}">${ic(e.cell ? 'table' : 'kbd')}<span>${snippet(e.txt, fq)}</span></button>`).join('')}${hits.length > 3
    ? `<button class="snip more" data-act="open-hit" data-id="${b.id}" data-n="3"><span>${hits.length === 4 ? 'Un altro risultato' : `Altri ${hits.length - 3} risultati`} in questa lavagna</span></button>` : ''}</div>` : '')).join('')}</div>`;
}
async function openHit(id, n) {
  const q = searchQ.trim(), b = meta.boards.find(x => x.id === id); if (!b) return;
  const hits = q ? boardHits(b, fold(q)) : [], e = hits[n] || hits[0];
  await openBoard(id);

/* Barra di ricerca nella lavagna: evidenzia i risultati e li scorre uno alla volta */
let find = null;
function hitQuad(hh) {
  const it = ed.items.find(x => x.id === hh.id); if (!it) return null;
  const tf = localToWorld(it); let x0, y0, x1, y1;
  if (hh.cell) {
    const [ri, ci] = hh.cell.split(',').map(Number);
    if (!it.rows || ri >= it.rows.length || ci >= it.cols.length) return null;
    const r = cellRect(it, ri, ci); x0 = r.x; y0 = r.y; x1 = r.x + r.w; y1 = r.y + r.h;
  } else { const g = geom(it); x0 = -g.hw; y0 = -g.hh; x1 = g.hw; y1 = g.hh; }
  return [[x0, y0], [x1, y0], [x1, y1], [x0, y1]].map(([a, b]) => tf(a, b));
}

  const fq = fold(q.trim()); if (!fq) return [];
  const out = [];
  for (const e of textEntries(ed.items)) {
    if (!fold(e.txt).includes(fq)) continue;
    const Q = hitQuad(e); if (!Q) continue;
    out.push({ ...e, cx: Q.reduce((s, p) => s + p[0], 0) / 4, cy: Q.reduce((s, p) => s + p[1], 0) / 4 });
  }
  return out.sort((a, b) => Math.abs(a.cy - b.cy) > 20 ? a.cy - b.cy : a.cx - b.cx);
}

  n.textContent = !find.q.trim() ? '' : find.hits.length ? `${find.i + 1} di ${find.hits.length}` : 'Nessun risultato';
  n.classList.toggle('none', !!find.q.trim() && !find.hits.length);
}

  const hh = find.hits[find.i]; if (!hh) return;
  const Q = hitQuad(hh); if (!Q) return;
  const xs = Q.map(p => p[0]), ys = Q.map(p => p[1]), w = Math.max(...xs) - Math.min(...xs), hgt = Math.max(...ys) - Math.min(...ys);
  let z = cam.z;
  if (!meta.ui.zoomLock) {
    const fit = Math.min((SW - 80) / w, (SH - 160) / hgt);
    if (z > fit) z = Math.max(ZMIN, fit);
    else if (z < 0.6) z = Math.min(1, fit);

  updZoomLabel(); requestRender(); scheduleSave();
}
function openFind(q, focus, entry) {
  find = { q: q || '', hits: [], i: 0, items: null };

/* ================= Puntatore laser: scia che svanisce, non viene salvata ================= */
const LASER_SPEEDS = [[500, 'Rapido'], [1100, 'Normale'], [2000, 'Lento'], [4000, 'Molto lento']];

const laser = { pts: [], raf: 0 };
function startLaserLoop() {
  if (laser.raf) return;
  const tick = () => {
    const now = performance.now();

    laser.pts = laser.pts.filter(p => now - p.t < fade);
    drawLive();
    if (ed && (laser.pts.length || (drawing && drawing.kind === 'laser'))) laser.raf = requestAnimationFrame(tick);
    else laser.raf = 0;
  };
  laser.raf = requestAnimationFrame(tick);
}

  for (const [w, col, k] of [[11, base.join(','), 0.32], [5, base.join(','), 0.9], [2, core.join(','), 1]]) {
    c.lineWidth = w / cam.z;

    let path = null, bucket = -1;
    const flush = () => { if (path) { c.strokeStyle = `rgba(${col},${(bucket / 12 * k).toFixed(3)})`; c.stroke(path); path = null; } };

      if (bk !== bucket || !path) { flush(); bucket = bk; path = new Path2D(); path.moveTo(a.x, a.y); }
      path.lineTo(b.x, b.y);
    }

}

/* ================= Google Drive ================= */
/* BoardLab parla con lo script "BoardLab Drive" del tuo account (Google Apps Script, app web).
   Solo quando premi il pulsante della nuvola in una cartella: invia le lavagne nuove o modificate,
   aggiorna i file già inviati (stesso file, stesso link) e su Drive non cancella mai niente.
   Nessuna attività in background. */
const DRV_FMTS = [['pdf', 'PDF'], ['png', 'PNG'], ['boardlab', 'BoardLab']];
const DRV_MIME = { pdf: 'application/pdf', png: 'image/png', boardlab: 'application/json' };
const DRV_URL_RE = /^https:\/\/script\.google\.com\/(?:a\/macros\/[^/\s]+|macros)\/s\/[\w-]+\/exec$/;
const DRV_MAX = 36e6; // byte: oltre, lo script non riesce a ricevere il file
const drvConf = () => meta.settings.drive || null; // { url, email, ok }
const drvOn = () => !!(drvConf() && drvConf().ok);
const drvFmts = f => (f.drive && f.drive.fmts && f.drive.fmts.length ? f.drive.fmts : ['pdf']);
function drvNeeds(b, f) {
  const s = b.drv;
  if (!s || s.fid !== f.drive.id || s.at !== b.modified || s.name !== b.name) return true;
  if (s.empty) return false;
  return drvFmts(f).some(k => !(s.files && s.files[k]));
}
const drvPending = f => (f && f.drive ? liveBoards().filter(b => b.folder === f.id && drvNeeds(b, f)) : []);
function drvKey() {
  if (meta.settings.drvKey) return meta.settings.drvKey;
  const a = new Uint8Array(32); crypto.getRandomValues(a);
  const C = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  meta.settings.drvKey = Array.from(a, v => C[v % 62]).join(''); saveMeta();
  return meta.settings.drvKey;
}
class DrvError extends Error { constructor(code, msg) { super(msg || code); this.code = code; } }
async function drvCall(body, url = drvConf().url) {
  if (!navigator.onLine) throw new DrvError('offline');
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 180000);
  let res, txt;
  try {
    res = await fetch(url, { method: 'POST', body: JSON.stringify({ ...body, key: drvKey() }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctl.signal });
    txt = await res.text();
  } catch (e) { throw new DrvError(e && e.name === 'AbortError' ? 'timeout' : 'net'); }
  finally { clearTimeout(t); }
  let j;
  try { j = JSON.parse(txt); } catch (_) { throw new DrvError(/accounts\.google\.com|ServiceLogin/i.test(txt) ? 'access' : /too large|troppo grand/i.test(txt) ? 'big' : 'bad'); }
  if (!j || !j.ok) throw new DrvError((j && j.err) || 'bad', j && j.msg);
  return j;
}
function drvMsg(e) {
  const c = e && e.code, m = (e && e.message) || '';
  if (c === 'offline') return 'Nessuna connessione a Internet. Riprova quando sei collegato.';
  if (c === 'net') return window.top !== window ? 'In questa versione di prova Google Drive non è raggiungibile: usa l\'app installata.' : 'Non riesco a raggiungere lo script. Controlla l\'indirizzo e che, nel deployment, "Chi ha accesso" sia "Chiunque".';
  if (c === 'access') return 'Lo script non è aperto a BoardLab: nel deployment, in "Chi ha accesso", scegli "Chiunque".';
  if (c === 'timeout') return 'Google Drive non ha risposto in tempo. Riprova.';
  if (c === 'big') return 'Il file è troppo grande per essere inviato (massimo circa 35 MB).';
  if (c === 'chiave') return 'Lo script è già collegato a un altro BoardLab. Su script.google.com esegui la funzione "scollegaBoardLab", poi ricollega.';
  if (c === 'link') return 'Il link non è quello di una cartella di Google Drive.';
  if (c === 'cartella') return 'La cartella di Drive non esiste più o non hai accesso. Collega di nuovo la cartella.';
  if (c === 'pdf') return 'Non riesco a creare il PDF. Chiudi e riapri BoardLab.';
  if (c === 'drive' && /Drive.{0,3}\s*(is not defined|non è definit)/i.test(m)) return 'Nello script manca il servizio Drive API: su script.google.com, a sinistra, Servizi → + → Drive API → Aggiungi. Poi crea un nuovo deployment.';
  if (c === 'drive') return 'Google Drive ha segnalato un errore: ' + m.slice(0, 160);
  return 'Lo script ha risposto in modo inatteso. Controlla che l\'indirizzo sia quello dell\'app web.';
}
const drvAlert = text => dialog({ title: 'Google Drive', text, ok: 'OK', noCancel: true });
const blobB64 = blob => blobToDataURL(blob).then(u => u.slice(u.indexOf(',') + 1));
const drvGoSettings = () => { settingsPage = 'cloud'; libMode = 'settings'; searching = false; renderLibrary(); };

async function drvConnect() {
  const inp = $('#drvUrl'), url = inp ? inp.value.trim() : '';
  if (!DRV_URL_RE.test(url)) { drvAlert('Incolla l\'indirizzo dell\'app web dello script: inizia con https://script.google.com/ e finisce con /exec.'); return; }
  toast('Collegamento a Google Drive…');
  try {
    const j = await drvCall({ a: 'ping' }, url);
    meta.settings.drive = { url, email: j.email || '', ok: true }; saveMeta(); renderLibrary();
    toast('Collegato a Google Drive' + (j.email ? ' · ' + j.email : ''));
  } catch (e) { $('#toast').hidden = true; drvAlert(drvMsg(e)); }
}
async function drvDisconnect() {
  const ok = await dialog({ title: 'Scollegare Google Drive?', text: 'Quello che hai già inviato resta su Drive. Potrai ricollegare lo stesso script in qualsiasi momento.', ok: 'Scollega', danger: true });
  if (!ok) return;
  meta.settings.drive = null; saveMeta(); renderLibrary();
}

/* Collegamento di una cartella di BoardLab a una cartella di Drive, con i formati da caricare */
async function drvFolderDialog(fid) {
  const f = meta.folders.find(x => x.id === fid); if (!f) return;
  if (!drvOn()) {
    if (await dialog({ title: 'Google Drive', text: 'Prima collega BoardLab a Google Drive, in Impostazioni → Google Drive.', ok: 'Vai' })) drvGoSettings();
    return;
  }
  const st = { mode: f.drive ? 'keep' : 'auto', link: '', fmts: new Set(f.drive ? drvFmts(f) : ['pdf', 'boardlab']), unlink: false };
  const body = h('div', 'expo drvd');
  const opt = (v, title, sub) => `<button class="drv-opt ${st.mode === v ? 'on' : ''}" data-m="${v}"><span class="rb"></span><span><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</span></button>`;
  const render = () => {
    body.innerHTML = `<div class="exp-l">Cartella su Drive</div>
      ${f.drive ? opt('keep', esc(f.drive.name), '') : ''}
      ${opt('auto', 'Crea automaticamente', 'BoardLab / ' + esc(f.name))}
      ${opt('link', 'Usa una cartella che ho già', '')}
      ${st.mode === 'link' ? '<input class="dlg-in" id="drvLink" aria-label="Link della cartella di Drive" autocomplete="off" spellcheck="false">' : ''}
      <div class="exp-l">Formati da caricare</div>
      <div class="exp-rows">${DRV_FMTS.map(([k, l]) => `<button class="exp-row" data-f="${k}"><span>${l}</span><span class="tg ${st.fmts.has(k) ? 'on' : ''}"></span></button>`).join('')}</div>
      ${f.drive ? '<button class="link drv-unl" data-u="1">Scollega questa cartella</button>' : ''}`;
    const li = $('#drvLink', body);
    if (li) { li.value = st.link; li.addEventListener('input', () => { st.link = li.value.trim(); }); setTimeout(() => li.focus(), 50); }
  };
  body.addEventListener('click', e => {
    const m = e.target.closest('[data-m]'), k = e.target.closest('[data-f]'), u = e.target.closest('[data-u]');
    if (m) { st.mode = m.dataset.m; render(); }
    else if (k) {
      if (st.fmts.has(k.dataset.f)) { if (st.fmts.size === 1) { toast('Serve almeno un formato'); return; } st.fmts.delete(k.dataset.f); } else st.fmts.add(k.dataset.f);
      render();
    } else if (u) { st.unlink = true; const c = body.closest('.dlg'); if (c) c.querySelector('.dlg-b .tbtn:last-child').click(); }
  });
  render();
  const ok = await dialog({ title: 'Google Drive · ' + f.name, body, ok: 'Salva' });
  if (!ok) return;
  if (st.unlink) { f.drive = null; saveMeta(); renderLibrary(); toast('Cartella scollegata da Drive'); return; }
  const fmts = DRV_FMTS.map(x => x[0]).filter(k => st.fmts.has(k));
  if (st.mode === 'keep') { f.drive.fmts = fmts; saveMeta(); renderLibrary(); return; }
  if (st.mode === 'link' && !st.link) { drvAlert('Non hai incollato il link della cartella.'); return; }
  toast('Collego la cartella…');
  try {
    const j = await drvCall(st.mode === 'link' ? { a: 'folder', link: st.link } : { a: 'folder', name: f.name });
    f.drive = { id: j.id, name: j.name, url: j.url, fmts }; saveMeta(); renderLibrary();
    const n = drvPending(f).length;
    if (n) toast(`Collegata a ${j.name}`, `Invia ${n === 1 ? 'la lavagna' : n + ' lavagne'}`, () => drvSync(f.id));
    else toast('Collegata a ' + j.name);
  } catch (e) { $('#toast').hidden = true; drvAlert(drvMsg(e)); }
}

/* Invio di una lavagna in tutti i formati della cartella */
async function drvSendBoard(b, f, fmts) {
  const data = (await DB.get('b:' + b.id)) || { items: [], bg: NEW_BG() };
  const items = data.items || [], bg = data.bg || NEW_BG(), at = b.modified, name = b.name;
  const s = b.drv && b.drv.fid === f.drive.id ? b.drv : null, same = !!(s && s.at === at && s.name === name);
  const files = { ...((s && s.files) || {}) };
  if (!items.length) { b.drv = { fid: f.drive.id, at, name, files, empty: true }; saveMeta(); return; }
  const prev = connScope; connScope = new Map(items.map(i => [i.id, i]));
  try {
    for (const k of fmts) {
      if (same && files[k]) continue;
      let blob;
      try { blob = await buildFile(items, bg, k, { name }); } catch (_) { throw new DrvError('pdf'); }
      if (!blob) continue;
      if (blob.size > DRV_MAX) throw new DrvError('big');
      const j = await drvCall({ a: 'put', folder: f.drive.id, board: b.id, fmt: k, name: fileSafe(name) + '.' + k, mime: DRV_MIME[k], file: files[k] || '', data: await blobB64(blob) });
      files[k] = j.id;
    }
  } finally { connScope = prev; evictImages(new Set()); }
  b.drv = { fid: f.drive.id, at, name, files }; saveMeta();
}

/* Il pulsante: invia le lavagne nuove o modificate della cartella, mostrando l'avanzamento */
let drvBusy = false;
async function drvSync(fid, onlyIds) {
  const f = meta.folders.find(x => x.id === fid); if (!f || drvBusy) return;
  if (!drvOn() || !f.drive) { drvFolderDialog(fid); return; }
  const list = drvPending(f).filter(b => !onlyIds || onlyIds.includes(b.id)).sort((a, b) => a.modified - b.modified);
  if (!list.length) { toast(onlyIds ? 'Su Drive sono già aggiornate' : 'Su Drive è già tutto aggiornato'); return; }
  if (!navigator.onLine) { drvAlert(drvMsg(new DrvError('offline'))); return; }
  drvBusy = true;
  const L = h('div', 'layer dim'), box = h('div', 'dlg drv-prog');
  box.innerHTML = `<div class="dlg-t">Invio a Google Drive</div><p class="dlg-p" id="drvP"></p><div class="drv-bar"><i></i></div><div class="dlg-b"><button class="tbtn">Interrompi</button></div>`;
  L.append(box); $('#layers').append(L);
  let stop = false; const sb = $('.tbtn', box), P = $('#drvP', box), bar = $('.drv-bar i', box);
  sb.onclick = () => { stop = true; sb.disabled = true; sb.textContent = 'MI FERMO DOPO QUESTA LAVAGNA'; };
  const fmts = drvFmts(f), errs = [];
  let sent = 0, fatal = null;
  for (let i = 0; i < list.length && !stop; i++) {
    const b = list[i];
    P.textContent = `Lavagna ${i + 1} di ${list.length} · ${b.name}`; bar.style.width = (100 * i / list.length) + '%';
    try { await drvSendBoard(b, f, fmts); sent++; }
    catch (e) {
      if (['big', 'pdf'].includes(e.code)) errs.push(b.name + ': ' + drvMsg(e));
      else { fatal = e; break; }
    }
  }
  bar.style.width = '100%';
  L.remove(); drvBusy = false;
  f.drive.last = Date.now(); saveMeta(); renderLibrary();
  const done = sent ? `${sent === 1 ? 'Inviata 1 lavagna' : `Inviate ${sent} lavagne`} a Drive.` : '';
  if (fatal) drvAlert((done ? done + ' ' : '') + drvMsg(fatal));
  else if (errs.length) drvAlert((done ? done + '\n\n' : '') + 'Non inviate:\n' + errs.join('\n'));
  else if (stop && sent < list.length) toast(`Interrotto · inviate ${sent} di ${list.length}`);
  else toast(done.replace(/\.$/, ''));
}

/* Pressione prolungata (500 ms) gestita dall'app, così funziona anche sopra le anteprime */
let lp = null;
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const t = e.target.closest('[data-ctx]'); if (!t || e.target.closest('.ib')) return;
  const x = e.clientX, y = e.clientY;
  t.classList.add('pressing');
  lp = { t, x, y, timer: setTimeout(() => {
    t.classList.remove('pressing'); lp = null;
    swallowUntil = performance.now() + 700; lpFired = performance.now();
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (_) {} }
    ctxOpen(t);
  }, 500) };
});
let lpFired = 0;
const lpCancel = () => { if (lp) { clearTimeout(lp.timer); lp.t.classList.remove('pressing'); lp = null; } };
document.addEventListener('pointermove', e => { if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 10) lpCancel(); });
document.addEventListener('pointerup', lpCancel);
document.addEventListener('pointercancel', lpCancel);
document.addEventListener('scroll', lpCancel, true);
document.addEventListener('contextmenu', e => {
  if (e.target.closest('input, textarea')) return;
  e.preventDefault();
  if (performance.now() - lpFired < 1000) return;
  const t = e.target.closest('[data-ctx]'); if (t && e.pointerType !== 'touch') { lpCancel(); ctxOpen(t); }
});
/* Doppio clic sul pulsante della penna: arriva come tasto "Unidentified" (pressione + rilascio). Il clic singolo arriva solo come rilascio e viene ignorato. */
let lastToggle = 0;
window.addEventListener('keydown', e => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const isPenBtn = e.key === 'Unidentified' || (!e.key && e.keyCode === 0);
  if (isPenBtn) {
    e.preventDefault();
    if (!ed || !meta.settings.dbl || $('#layers').children.length) return;
    const now = performance.now(); if (now - lastToggle < 250) return; lastToggle = now;
    toggleEraser(); return;
  }
  if (!ed) { if (e.key === 'Escape' && lsel) libClear(); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel) { e.preventDefault(); deleteSel(); return; }
  if (e.key === 'Escape') { clearSel(); hidePasteBar(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); openFind(find ? find.q : '', true); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c' && sel) { copySel(); toast('Copiato'); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v' && clip) { if (meta.tool.tool !== 'lasso') setTool('lasso'); pasteClip(null); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
}, true);

/* ================= Avvio ================= */
(async function init() {
  $$('[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic); });
  let m = await DB.get('meta');
  if (!m || !m.v) {
    m = seedMeta();
    for (const b of m.boards) await DB.set('b:' + b.id, { items: [], bg: NEW_BG(), view: null });
    await DB.set('meta', m);
  }
  const d = seedMeta();
  m.settings = Object.assign({}, d.settings, m.settings);
  m.ui = Object.assign({}, d.ui, m.ui);
  m.tool = Object.assign({}, d.tool, m.tool);
  if (!Array.isArray(m.palette) || !m.palette.length) m.palette = DEFAULT_PALETTE.slice();
  // anteprime spostate fuori dall'elenco (versioni fino alla 0.6)
  let moved = false;
  for (const x of (m.boards || []).concat(m.tpls || [])) if ('thumb' in x) { if (x.thumb) { await DB.set('th:' + x.id, x.thumb); THUMBS.set(x.id, x.thumb); } delete x.thumb; moved = true; }
  if (moved) await DB.set('meta', m);
  meta = m;
  for (const f of meta.folders) { const i = FOLDER_OLD.indexOf(String(f.color).toLowerCase()); if (i >= 0) f.color = FOLDER_COLORS[i]; }
  astInit();
  if (!meta.ui.col) { const f0 = meta.folders.find(f => f.id === meta.ui.folder); meta.ui.col = f0 ? f0.col : (meta.collections[0] || {}).id; }
  if (meta.ui.view === undefined && meta.settings.view === 'list') meta.settings.view = 'list';
  buildToolbar();
  renderLibrary();
  try { history.replaceState({ bl: 'root' }, ''); history.pushState({ bl: 'lib' }, ''); } catch (_) {}
  if (!meta.ui.lastGc || Date.now() - meta.ui.lastGc > 7 * 864e5) setTimeout(() => gcImages(), 8000);
})();
</script>

<script>
/* Service worker: salva l'app sul tablet per l'uso senza rete. Gli aggiornamenti si installano solo quando tocchi AGGIORNA. */
(function () {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  let waiting = null, reloading = false;
  const bar = document.getElementById('updBar');
  const offer = w => { if (!navigator.serviceWorker.controller) return; waiting = w; bar.hidden = false; };
  document.getElementById('updBtn').onclick = async () => {
    bar.hidden = true;
    try { if (typeof ed !== 'undefined' && ed) { commitText(); await saveBoardNow(); } if (typeof meta !== 'undefined' && meta) await DB.set('meta', meta); } catch (_) {}
    if (waiting) waiting.postMessage('skipWaiting'); else location.reload();
  };
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading) return; reloading = true; location.reload(); });
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      if (reg.waiting) offer(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') offer(w); }); });
    } catch (_) {}
  });
})();
</script>
